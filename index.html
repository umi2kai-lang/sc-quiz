<script>
const Q=[{"id": "22aS4", "src": "令和4年秋 午前II 問4", "exam": "A-2", "cat": "攻撃手法・対策", "q": "DoS 攻撃の-つである Smurf 攻撃はどれか。", "c": ["TCP 接続要求である SYN パケットを攻撃対象に大量に送り付ける。", "偽装した ICMP の要求パケットを送って, 大量の応答パケットが攻撃対象に送られるようにする。", "サイズが大きい UDP パケットを攻撃対象に大量に送り付ける。", "サイズが大きい電子メールや大量の電子メールを攻撃対象に送り付ける。"], "a": 1, "e": "Smurfは送信元を攻撃対象に偽装したICMPエコー要求をブロードキャストし、大量の応答を攻撃対象に集中させる。アはSYNフラッド。"}, {"id": "22aS6", "src": "令和4年秋 午前II 問6", "exam": "A-2", "cat": "攻撃手法・対策", "q": "パスワードスプレー攻撃に該当するものはどれか。", "c": ["攻撃対象とする利用者 ID をーーつ定め, 辞書及び人名リストに掲載されている単語及び人名並びにそれらの組合せを順にパスワードとして入力して, ログインを試行する。", "攻撃対象とする利用者 ID を一つ定め, パスワードを総当たりして, ログインを試行する。", "攻撃の時刻と攻撃元 IP アドレスとを変え, かつ, アカウントロックを回避しながらよく用いられるパスワードを複数の利用者 ID に同時に試し, ログインを試行する。", "不正に取得したある他のサイトの利用者 ID とパスワードとの組みの一覧表を用いて, ログインを試行する。"], "a": 2, "e": "パスワードスプレーは「よく使われるパスワード」を多数のIDに少しずつ試し、アカウントロックを回避する。アは辞書攻撃、イは総当たり、エはリスト型攻撃。"}, {"id": "22aS8", "src": "令和4年秋 午前II 問8", "exam": "A-2", "cat": "暗号・認証", "q": "前方秘匿性 (Forward Secrecy) の説明として, 適切なものはどれか。", "c": ["鍵交換に使った秘密鍵が漏えいしたとしても, それより前の暗号文は解読されない。", "時系列データをチェーンの形で結び, かつ, ネットワーク上の複数のノードで共有するので, データを改ざんできない。", "対となる二つの鍵の片方の鍵で暗号化したデータは, もう片方の鍵でだけ復号できる。", "データに非可逆処理をして生成される固定長のハッシュ値からは, 元のデータを推測できない。"], "a": 0, "e": "前方秘匿性(PFS)は、長期鍵が後で漏れても過去のセッション鍵は導出できない性質。DHE/ECDHEの一時鍵で実現。"}, {"id": "22aS12", "src": "令和4年秋 午前II 問12", "exam": "A-2", "cat": "暗号・認証", "q": "ブロックチェーンに関する記述のうち, 適切なものはどれか。", "c": ["RADIUS を必須の技術として, 参加者の利用者認証を一元管理するために利用する。", "SPF を必須の技術として, 参加者間で電子メールを送受信するときに送信元の真正性を確認するために利用する。", "楕円曲線暗号を必須の技術として, 参加者間の P2P (Peer to Peer) 通信を暗号化するために利用する。", "ハッシュ関数を必須の技術として, 参加者がデータの改ざんを検出するために利用する。"], "a": 3, "e": "ブロックチェーンは各ブロックに前ブロックのハッシュ値を持たせて連結し、改ざんを検出可能にする。"}, {"id": "22aS13", "src": "令和4年秋 午前II 問13", "exam": "A-2", "cat": "ネットワーク", "q": "PC からサーバに対し, IPv6 を利用した通信を行う場合, ネットワーク層で暗号化を行うときに利用するものはどれか。", "c": ["IPsec", "PPP", "SSH", "TLS"], "a": 0, "e": "ネットワーク層(IP層)で暗号化するのはIPsec。SSH/TLSはより上位層。"}, {"id": "22aS14", "src": "令和4年秋 午前II 問14", "exam": "A-2", "cat": "Web・メール・DNS", "q": "SMTP-AUTH の特徴はどれか。", "c": ["ISP 管理下の動的 IP アドレスから管理外ネットワークのメールサーバへの SMTP接続を禁止する。", "電子メール送信元のメールサーバが送信元ドメインの DNS に登録されていることを確認してから, 電子メールを受信する。", "メールクライアントからメールサーバへの電子メール送信時に, 利用者 ID とパスワードなどによる利用者認証を行う。", "メールクライアントからメールサーバへの電子メール送信は, POP 接続で利用者認証済みの場合にだけ許可する。"], "a": 2, "e": "SMTP-AUTHはメール送信時(クライアント→サーバ)にID・パスワードで利用者認証する。エはPOP before SMTP、アはOP25B。"}, {"id": "22aS15", "src": "令和4年秋 午前II 問15", "exam": "A-2", "cat": "Web・メール・DNS", "q": "SPF によるドメイン認証を実施する場合, SPF の導入時に, 電子メール送信元アドレスのドメイン所有者側で行う必要がある設定はどれか。", "c": ["DNS サーバに SPF レコードを登録する。", "DNS の問合せを受け付けるポート番号を変更する。", "メールサーバにデジタル証明書を導入する。", "メールサーバの TCP ポート 25番を利用不可にする。"], "a": 0, "e": "SPFでは送信ドメイン側が、正規の送信サーバのIPをDNSのSPF(TXT)レコードに登録する。"}, {"id": "22aS17", "src": "令和4年秋 午前II 問17", "exam": "A-2", "cat": "ネットワーク", "q": "無線LAN のアクセスポイントがもつプライバシーセパレータ機能 (アクセスポイントアイソレーション) の説明はどれか。", "c": ["アクセスポイントの識別子を知っている利用者だけに機器の接続を許可する。", "同じアクセスポイントに無線で接続している機器同士の通信を禁止する。", "事前に登録された MAC アドレスをもつ機器だけに無線 LAN への接続を許可する。", "建物外への無線 LAN 電波の漏れを防ぐことによって第三者による盗聴を防止する。"], "a": 1, "e": "プライバシーセパレータは同じAPに接続した端末同士の通信を遮断する機能。ウはMACアドレスフィルタリング。"}, {"id": "22aS18", "src": "令和4年秋 午前II 問18", "exam": "A-2", "cat": "ネットワーク", "q": "IPv6 の特徴として, 適切なものはどれか。", "c": ["IPv6 アドレスから MAC アドレスを調べる際に ARP を使う。", "アドレス空間は IPv4 の 2'%倍である。", "経路の途中でフラグメンテーションを行うことが可能である。", "ヘッダーは固定長であり, 拡張ヘッダー長は8オクテットの整数倍である。"], "a": 3, "e": "IPv6の基本ヘッダは40オクテット固定長、拡張ヘッダは8オクテット単位。ARPではなくNDPを使い、途中ルータでのフラグメントは不可。"}, {"id": "22aS19", "src": "令和4年秋 午前II 問19", "exam": "A-2", "cat": "ネットワーク", "q": "クラスDのTIP アドレスを使用するのはどの場合か。", "c": ["端末数が 250 台程度までの比較的小規模なネットワークのホストアドレスを割り振る。", "端末数が 65, 669 台程度の中規模なネットワークのホストアドレスを割り振る。", "プライベートアドレスを割り振る。", "マルチキャストアドレスを割り振る。"], "a": 3, "e": "クラスD(224.0.0.0〜239.255.255.255)はマルチキャスト用。"}, {"id": "22aS20", "src": "令和4年秋 午前II 問20", "exam": "A-2", "cat": "ネットワーク", "q": "IP ネットワークにおいて, クライアントの設定を変えることなくデフォルトゲートウェイの障害を回避するために用いられるプロトコルはどれか。", "c": ["RARP", "RSTP", "RTSP", "VRRP"], "a": 3, "e": "VRRPは複数ルータで仮想IPを共有し、デフォルトゲートウェイを冗長化する。"}, {"id": "22aS23", "src": "令和4年秋 午前II 問23", "exam": "A-2", "cat": "管理・法規・標準", "q": "SD メモリカードに使用される著作権保護技術はどれか。", "c": ["CPPM (Content Protection for Prerecorded Media)", "CPRM (Content Protection for Recordable Media)", "DTCP (Digital Transmission Content Protection)", "HDCP (High-bandwidth Digital Content Protection)"], "a": 1, "e": "SDカードの著作権保護はCPRM。DTCPは伝送路、HDCPはHDMI等の映像出力の保護。"}, {"id": "22aS25", "src": "令和4年秋 午前II 問25", "exam": "A-2", "cat": "管理・法規・標準", "q": "被監査企業が SaaS をサービス利用契約して業務を実施している場合, 被監査企業のシステム監査人が SaaS の利用者環境から SaaS へのアクセスコントロールを評価できる対象の ID はどれか。", "c": ["DBMS の管理者 ID", "アプリケーションの利用者 ID", "サーバの OS の利用者", "ストレージデバイスの管理者 ID【 メ モ 用 紙"], "a": 1, "e": "SaaSの利用者側で監査人が評価できるのは、自社が管理するアプリケーションの利用者IDのアクセス制御。基盤側IDは事業者管理。"}, {"id": "22hS1", "src": "令和4年春 午前II 問1", "exam": "A-2", "cat": "攻撃手法・対策", "q": "Web サーバのログを分析したところ, Web サーバへの攻撃と思われる HTTP リクエストヘッダが記録されていた。 次の HTTP リクエストヘッダから推測できる, 攻撃者が悪用しようとしていた可能性が高い脆弱性はどれか。ここで, HTTP リクエストヘッダ中の “%20” は空白を意味する。[HTTP リクエストヘッダの一部〕GET /cgi-bin/submit.cgi?user=:cat%29/etc/passwd HTTP/1.1Accept: */*Accept-Language: jaUA-CPU: x86Accept-Encoding: gzip, deflateUser-Agent: (省略)Host: test.example.comConnection: Keep-Alive", "c": ["HTTP ヘッダインジェクション (HTTP Response Splitting)", "OSコマンドインジェクション", "SQL インジェクション", "クロスサイトスクリプティング"], "a": 1, "e": "「;cat /etc/passwd」のようにシェルのコマンド区切りを入力に混入させるのはOSコマンドインジェクション。"}, {"id": "22hS2", "src": "令和4年春 午前II 問2", "exam": "A-2", "cat": "暗号・認証", "q": "SAML (Security Assertion Markup Language) の説明として, 最も適切なものはどれか。", "c": ["Web サービスに関する情報を公開し, Web サービスが提供する機能などを検索可能にするための仕様", "権限がない利用者による読取り, 改ざんから電子メールを保護して送信するための仕様", "デジタル署名に使われる鍵情報を効率よく管理するための Web サービスの仕様", "認証情報に加え, 属性情報と認可情報を異なるドメインに伝達するための Web サービスの仕様"], "a": 3, "e": "SAMLは認証情報・属性情報・認可情報をXMLのアサーションとして異なるドメイン間で伝達する仕様。"}, {"id": "22hS3", "src": "令和4年春 午前II 問3", "exam": "A-2", "cat": "攻撃手法・対策", "q": "暗号化装置における暗号化処理時の消費電力を測定するなどして, 当該装置内部の秘密情報を推定する攻撃はどれか。", "c": ["キーロガー", "サイドチャネル攻撃", "スミッシング", "中間者攻撃"], "a": 1, "e": "消費電力・処理時間・電磁波など物理的な漏洩情報から秘密を推定するのがサイドチャネル攻撃。"}, {"id": "22hS5", "src": "令和4年春 午前II 問5", "exam": "A-2", "cat": "攻撃手法・対策", "q": "標的型攻撃における攻撃者の行動をモデル化したものの一つにサイバーキルチェーンがあり, 攻撃者の行動を 7 段階に分類している。標的とした会社に対する攻撃者の行動のうち, 偵察の段階に分類されるものはどれか。", "c": ["攻撃者が, インターネットに公開されていない社内ポータルサイトから, 会社の組織図, 従業員情報, メールアドレスなどを入手する。", "攻撃者が, 会社の役員が登録している SNS サイトから, 攻撃対象の人間関係, 趣味などを推定する。", "攻撃者が, 取引先になりすまして, 標的とした会社にマルウェアを添付した攻撃メールを送付する。", "攻撃者が, ボットに感染したPC を遠隔操作して社内ネットワーク上の PC を次々にマルウェア感染させて, 利用者 ID とパスワードを入手する。"], "a": 1, "e": "サイバーキルチェーンの「偵察」は公開情報(SNS等)から標的を調べる段階。アは侵入後の情報収集、ウは配送、エは目的実行/横展開。"}, {"id": "22hS7", "src": "令和4年春 午前II 問7", "exam": "A-2", "cat": "管理・法規・標準", "q": "安全・安心な IT 社会を実現するために創設された制度であり, IPA “中小企業の情報セキュリティ対策ガイドライン\" に沿った情報セキュリティ対策に取り組むことを中小企業などが自己宣言するものはどれか。", "c": ["ISMS 適合性評価制度", "ITセキュリティ評価及び認証制度", "MyJVN", "SECURITY ACTION"], "a": 3, "e": "SECURITY ACTIONは中小企業がIPAガイドラインに沿った取組みを自己宣言する制度(一つ星・二つ星)。"}, {"id": "22hS9", "src": "令和4年春 午前II 問9", "exam": "A-2", "cat": "管理・法規・標準", "q": "経済産業省と IPA が策定した“サイバーセキュリティ経営ガイドライン (Ver2.6)” に関する記述のうち, 適切なものはどれか。", "c": ["経営者が, 実施するサイバーセキュリティ対策を投資ではなくコストとして捉えることを重視し, コストパフォーマンスの良いサイバーセキュリティ対策をまとめたものである。", "経営者が認識すべきサイバーセキュリティに関する原則と, 経営者がリーダシップを発揮して取り組むべき項目を取りまとめたものである。", "事業の規模やビジネスモデルによらず, 全ての経営者が自社に適用すべきサイバーセキュリティ対策を定めたものである。", "製造業のサプライチェーンを構成する小規模事業者の経営者が, サイバー攻撃を受けた際に行う事後対応をまとめたものである。"], "a": 1, "e": "サイバーセキュリティ経営ガイドラインは、経営者が認識すべき3原則と、CISO等に指示すべき重要10項目をまとめたもの。"}, {"id": "22hS10", "src": "令和4年春 午前II 問10", "exam": "A-2", "cat": "管理・法規・標準", "q": "CRYPTREC の主な活動内容はどれか。", "c": ["暗号技術の技術的検討並びに国際競争力の向上及び運用面での安全性向上に関する検討を行う。", "情報セキュリティ政策に係る基本戦略の立案, 官民における統一的, 横断的な情報セキュリティ対策の推進に係る企画などを行う。", "組織の情報セキュリティマネジメントシステムを評価して認証する制度を運用する。", "認証機関から貸与された暗号モジュール試験報告書作成支援ツールを用いて暗号モジュールの安全性についての評価試験を行う。"], "a": 0, "e": "CRYPTRECは電子政府推奨暗号の安全性評価・監視、暗号技術の運用面の検討を行うプロジェクト。イはNISC。"}, {"id": "22hS11", "src": "令和4年春 午前II 問11", "exam": "A-2", "cat": "攻撃手法・対策", "q": "インターネットバンキングの利用時に被害をもたらす MITB (Man-in-the-Browser) 攻撃に有効なインターネットバンクでの対策はどれか。", "c": ["インターネットバンキングでの送金時に接続する Web サイトの正当性を利用者が確認できるよう, EV SSL サーバ証明書を採用する。", "インターネットバンキングでの送金時に利用者が入力した情報と, 金融機関が受信した情報とに差異がないことを検証できるよう, トランザクション署名を利用する。", "インターネットバンキングでのログイン認証において, 一定時間ごとに自動的に新しいパスワードに変更されるワンタイムパスワードを導入する。", "インターネットバンキング利用時の通信を SSL ではなく TLS を利用して暗号化するように Web サイトを設定する。"], "a": 1, "e": "MITBはブラウザ内で送金内容を改ざんする。利用者入力内容と銀行受信内容の一致を別デバイスで検証するトランザクション署名が有効。"}, {"id": "22hS13", "src": "令和4年春 午前II 問13", "exam": "A-2", "cat": "Web・メール・DNS", "q": "DNSSEC で実現できることはどれか。", "c": ["DNS キャッシュサーバが得た応答中のリソースレコードが, 権威 DNS サーバで管理されているものであり, 改ざんされていないことの検証", "権威DNS サーバと DNS キャッシュサーバとの通信を暗号化することによる, ゾーン情報の漏えいの防止", "長音“一' と漢数字 “一\" などの似た文字をドメイン名に用いて, 正規サイトのように見せかける攻撃の防止", "利用者のURL の入力誤りを悪用して, 偽サイトに誘導する攻撃の検知"], "a": 0, "e": "DNSSECは権威サーバのリソースレコードにデジタル署名し、キャッシュサーバが出自と改ざんの有無を検証する。暗号化はしない。"}, {"id": "22hS15", "src": "令和4年春 午前II 問15", "exam": "A-2", "cat": "暗号・認証", "q": "TLS に関する記述のうち, 適切なものはどれか。", "c": ["TLS で使用する Web サーバのデジタル証明書には IP アドレスの組込みが必須なので, Web サーバの IP アドレスを変更する場合は, デジタル証明書を再度取得する必要がある。", "TLS で使用する共通鍵の長さは, 128 ビット未満で任意に指定する。", "TLS で使用する個人認証用のデジタル証明書は, IC カードにも格納することができ, 利用する PC を特定の PC に限定する必要はない。", "TLS は Web サーバと特定の利用者が通信するためのプロトコルであり, Web サーバへの事前の利用者登録が不可欠である。"], "a": 2, "e": "TLSのクライアント証明書はICカードに格納でき、端末を限定しない。証明書にIPアドレスは必須でなく、事前登録も不要。"}, {"id": "22hS18", "src": "令和4年春 午前II 問18", "exam": "A-2", "cat": "ネットワーク", "q": "IEEE 802.11a/b/g/n で採用されているアクセス制御方式はどれか。", "c": ["CSMA/CA", "CSMA/CD", "LAPB", "トークンパッシング方式"], "a": 0, "e": "IEEE 802.11の無線LANはCSMA/CA(衝突回避)。有線EthernetはCSMA/CD。"}, {"id": "22hS19", "src": "令和4年春 午前II 問19", "exam": "A-2", "cat": "ネットワーク", "q": "インターネットに接続された PC の時刻合わせに使用されるプロトコルはどれか。", "c": ["NNTP", "RTCP", "SNTP", "TFTP"], "a": 2, "e": "SNTP(簡易NTP)はPC等の時刻同期に使われる。NNTPはネットニュース、TFTPは簡易ファイル転送。"}, {"id": "22hS20", "src": "令和4年春 午前II 問20", "exam": "A-2", "cat": "ネットワーク", "q": "複数台のレイヤ 2スイッチで構成されるネットワークが複数の経路をもつ場合に,イーサネットフレームのループが発生することがある。そのループの発生を防ぐための TCP/IP ネットワークインタフェース層のプロトコルはどれか。", "c": ["IGMP", "RIP", "SIP", "スパニングツリープロトコル"], "a": 3, "e": "L2スイッチのループ防止はスパニングツリープロトコル(STP)。"}, {"id": "22hS21", "src": "令和4年春 午前II 問21", "exam": "A-2", "cat": "開発・DB・運用", "q": "データウェアハウスのメタデータに関する記述のうち, データリネージはどれか。", "c": ["誰がどのデータを見てよいかを示す情報であり, 適切なアクセス制御を目的として設定される。", "データが誰によって作られ管理されているかを示す情報であり, データ構造やデータ辞書を見ても意味が分からないときの問合せ先を表す。", "データがどこから発生し, どのような変換及び加工を経て, 現在の形になったかを示す情報であり, データの生成源の特定又は障害時の影響調査に利用できる。", "データ構造がどのように定義されているかを示す情報であり, Web サイトなどに公開して検索できるようにする。"], "a": 2, "e": "データリネージは「データの出所と変換・加工の履歴」。障害時の影響調査や生成源特定に使う。"}, {"id": "22hS22", "src": "令和4年春 午前II 問22", "exam": "A-2", "cat": "開発・DB・運用", "q": "システムに規定外の無効なデータが入力されたとき, 誤入力であることを伝えるメッセージを表示して正しい入力を促すことによって, システムを異常終了させない設計は何というか。", "c": ["フールプルーフ", "フェールセーフ", "フェールソフト", "フォールトトレランス"], "a": 0, "e": "誤入力を検知して正しい入力を促し、異常終了させないのはフールプルーフ。"}, {"id": "22hS23", "src": "令和4年春 午前II 問23", "exam": "A-2", "cat": "開発・DB・運用", "q": "JIS X 9169:2921 (ソフトウェアライフサイクルプロセス) によれば, ライフサイクルモデルの目的及び成果を達成するために, ライフサイクルプロセスを修正するか,又は新しいライフサイクルプロセスを定義することを何というか。", "c": ["シミュレーション", "修整 (Tailoring)", "統治 (Governance)", "ベンチマーキング"], "a": 1, "e": "既存のライフサイクルプロセスを目的に合わせて修正・定義することをテーラリング(修整)という。"}, {"id": "23aK4", "src": "令和5年秋 高度午前I(共通) 問4", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "パイプラインの性能を向上させるための技法の一つで, 分岐条件の結果が決定する前に, 分岐先を予測して命令を実行するものはどれか。", "c": ["アウトオブオーダー実行", "遅延分岐", "投機実行", "レジスタリネーミング"], "a": 2, "e": "分岐結果が決まる前に予測した分岐先を実行するのは投機実行。"}, {"id": "23aK5", "src": "令和5年秋 高度午前I(共通) 問5", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "IaC (Infrastructure as Code) に関する記述として, 最も適切なものはどれか。", "c": ["インフラストラクチャの自律的なシステム運用を実現するために, インシデントへの対応手順をコードに定義すること", "各種開発支援ツールを利用するために, ツールの連携手順をコードに定義すること", "継続的インテグレーションを実現するために, アプリケーションの生成手順や試験の手順をコードに定義すること", "ソフトウェアによる自動実行を可能にするために, システムの構成や状態をコードに定義すること"], "a": 3, "e": "IaCはシステム構成や状態をコードで定義し、ソフトウェアで自動構築・再現できるようにする手法。"}, {"id": "23aK8", "src": "令和5年秋 高度午前I(共通) 問8", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "バーチャルリアリティに関する記述のうち, レンダリングの説明はどれか。", "c": ["ウェアラブルカメラ, 慣性センサーなどを用いて非言語情報を認識する処理", "仮想世界の情報をディスプレイに描画可能な形式の画像に変換する処理", "視覚的に現実世界と仮想世界を融合させるために, それぞれの世界の中に定義された 3 次元座標を一致させる処理", "時間経過とともに生じる物の移動などの変化について, モデル化したものを物理法則などに当てはめて変化させる処理"], "a": 1, "e": "VRのレンダリングは、仮想世界の情報をディスプレイに描画できる画像へ変換する処理。"}, {"id": "23aK11", "src": "令和5年秋 高度午前I(共通) 問11", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "IPv4 ネットワークにおけるマルチキャストの使用例に関する記述として, 適切なものはどれか。", "c": ["LAN に初めて接続する PC が, DHCP プロトコルを使用して, 自分自身に割り当てられる IP アドレスを取得する際に使用する。", "ネットワーク機器が, ARP プロトコルを使用して, 宛先 IP アドレスから MAC アドレスを得るためのリクエストを送信する際に使用する。", "メーリングリストの利用者が, SMTP プロトコルを使用して, メンバー全員に対し, 同一内容の電子メールを一斉送信する際に使用する。", "ルータがRIP-2 プロトコルを使用して, 隣接するルータのグループに, 経路の更新情報を送信する際に使用する。"], "a": 3, "e": "RIP-2は経路情報をマルチキャスト(224.0.0.9)で送る。DHCP DISCOVERやARP要求はブロードキャスト。"}, {"id": "23aK12", "src": "令和5年秋 高度午前I(共通) 問12", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "パスワードクラック手法の一種である, レインボーテーブル攻撃に該当するものはどれか。", "c": ["何らかの方法で事前に利用者 ID と平文のパスワードのリストを入手しておき,複数のシステム間で使い回されている利用者 ID とパスワードの組みを狙って, ログインを試行する。", "パスワードに成り得る文字列の全てを用いて, 総当たりでログインを試行する。", "平文のパスワードとハッシュ値をチェーンによって管理するテーブルを準備しておき, それを用いて, 不正に入手したハッシュ値からパスワードを解読する。", "利用者の誕生日, 電話番号などの個人情報を言葉巧みに聞き出して, パスワードを類推する。"], "a": 2, "e": "レインボーテーブル攻撃は、平文とハッシュ値をチェーンで圧縮管理した表を使ってハッシュから平文を求める。"}, {"id": "23aK15", "src": "令和5年秋 高度午前I(共通) 問15", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "DKIM (DomainKeys Identified Mail) に関する記述のうち, 適切なものはどれか。", "c": ["送信側のメールサーバで電子メールにデジタル署名を付与し, 受信側のメールサーバでそのデジタル署名を検証して送信元ドメインの認証を行う。", "送信者が電子メールを送信するとき, 送信側のメールサーバは, 送信者が正規の利用者かどうかの認証を利用者 ID とパスワードによって行う。", "送信元ドメイン認証に失敗した際の電子メールの処理方法を記載したポリシーをDNS サーバに登録し, 電子メールの認証結果を監視する。", "電子メールの送信元ドメインでメール送信に使うメールサーバの IP アドレスをDNS サーバに登録しておき, 受信側で送信元ドメインの DNS サーバに登録されている IP アドレスと電子メールの送信元メールサーバの IP アドレスとを照合する。"], "a": 0, "e": "DKIMは送信側サーバがメールに署名し、受信側がDNS上の公開鍵で検証して送信ドメインを認証する。エはSPF、ウはDMARC。"}, {"id": "23aK16", "src": "令和5年秋 高度午前I(共通) 問16", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "アプリケーションソフトウェアの開発環境上で, 用意された部品やテンプレートをGUI による操作で組み合わせたり, 必要に応じて一部の処理のソースコードを記述したりして, ソフトウェアを開発する手法はどれか。", "c": ["継続的インテグレーション", "ノーコード開発", "プロトタイピング", "ローコード開発"], "a": 3, "e": "GUI部品の組合せ＋必要に応じて一部コード記述はローコード開発。コードを一切書かないのがノーコード。"}, {"id": "23aK17", "src": "令和5年秋 高度午前I(共通) 問17", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "組込みシステムのソフトウェア開発に使われる IDE の説明として, 適切なものはどれか。", "c": ["エディター, コンパイラ, リンカ, デバッガなどが一体となったツール", "専用のハードウェアインタフェースで CPU の情報を取得する装置", "ターゲットCPUを搭載した評価ボードなどの実行環境", "タスクスケジューリングでの仕組みなどを提供するソフトウェア"], "a": 0, "e": "IDE(統合開発環境)はエディタ、コンパイラ、リンカ、デバッガなどを一体化したツール。"}, {"id": "23aK18", "src": "令和5年秋 高度午前I(共通) 問18", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "PMBOK ガイド 第 7 版によれば, プロジェクト・スコープ記述書に記述する項目はどれか。", "c": ["WBS", "コスト見積額", "ステークホルダー分類", "プロジェクトの除外事項"], "a": 3, "e": "プロジェクト・スコープ記述書にはスコープの説明、成果物、受入基準、除外事項などを記述する。"}, {"id": "23aK21", "src": "令和5年秋 高度午前I(共通) 問21", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "フルバックアップ方式と差分バックアップ方式とを用いた運用に関する記述のうち,適切なものはどれか。", "c": ["障害からの復旧時に差分バックアップのデータだけ処理すればよいので, フルバックアップ方式に比べ, 差分バックアップ方式は復旧時間が短い。", "フルバックアップのデータで復元した後に, 差分バックアップのデータを反映させて復旧する。", "フルバックアップ方式と差分バックアップ方式とを併用して運用することはできない。", "フルバックアップ方式に比べ, 差分バックアップ方式はバックアップに要する時間が長い。"], "a": 1, "e": "差分バックアップの復旧は、フルバックアップを戻してから最新の差分を反映する。"}, {"id": "23aK22", "src": "令和5年秋 高度午前I(共通) 問22", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "販売管理システムにおいて, 起票された受注伝票の入力が, 漏れなく, かつ, 重複することなく実施されていることを確かめる監査手続として, 適切なものはどれか。", "c": ["受注データから値引取引データなどの例外取引データを抽出し, 承認の記録を確かめる。", "受注伝票の入力時に論理チェック及びフォーマットチェックが行われているか,テストデータ法で確かめる。", "販売管理システムから出力したプルーフリストと受注伝票との照合が行われているか, プルーフリストと受注伝票上の照合印を確かめる。", "並行シミュレーション法を用いて, 受注伝票を処理するプログラムの論理の正確性を確かめる。"], "a": 2, "e": "入力の網羅性・重複なしは、システム出力のプルーフリストと元伝票を照合して確かめる。"}, {"id": "23aK23", "src": "令和5年秋 高度午前I(共通) 問23", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "バックキャスティングの説明として, 適切なものはどれか。", "c": ["システム開発において, 先にプロジェクト要員を確定し, リソースの範囲内で優先すべき機能から順次提供する開発手法", "前提として認識すべき制約を受け入れた上で未来のありたい姿を描き, 予想される課題や可能性を洗い出し解決策を検討することによって, ありたい姿に近づける思考方法", "組織において, 下位から上位への発議を受け付けて経営の意思決定に反映するマネジメント手法", "投資戦略の有効性を検証する際に, 過去のデータを用いてどの程度の利益が期待できるかをシミュレーションする手法"], "a": 1, "e": "バックキャスティングは未来のありたい姿から逆算して、今やるべきことを考える思考法。"}, {"id": "23aK24", "src": "令和5年秋 高度午前I(共通) 問24", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "SOAを説明したものはどれか。", "c": ["企業改革において既存の組織やビジネスルールを抜本的に見直し, 業務フロー,管理機構及び情報システムを再構築する手法のこと", "企業の経営資源を有効に活用して経営の効率を向上させるために, 基幹業務を部門ごとではなく 統合的に管理するための業務システムのこと", "発注者と IT アウトソーシングサービス提供者との間で, サービスの品質について合意した文書のこと", "ビジネスプロセスの構成要素とそれを支援する IT 基盤を, ソフトウェア部品であるサービスとして提供するシステムアーキテクチャのこと"], "a": 3, "e": "SOA(サービス指向アーキテクチャ)は業務機能をサービス部品として組み合わせるアーキテクチャ。アはBPR、イはERP、ウはSLA。"}, {"id": "23aK25", "src": "令和5年秋 高度午前I(共通) 問25", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "半導体メーカーが行っているファウンドリーサービスの説明として, 適切なものはどれか。", "c": ["商号や商標の使用権とともに, 一定地域内での商品の独占販売権を与える。", "自社で半導体製品の企画, 設計から製造までを一貫して行い, それを自社ブランドで販売する。", "製造設備をもたず, 半導体製品の企画, 設計及び開発を専門に行う。", "他社からの製造委託を受けて, 半導体製品の製造を行う。"], "a": 3, "e": "ファウンドリーは他社の設計に基づいて半導体の製造を受託する。ウはファブレス。"}, {"id": "23aK26", "src": "令和5年秋 高度午前I(共通) 問26", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "市場を消費者特性でセグメント化する際に, 基準となる変数を, 地理的変数 人口統計的変数, 心理的変数 行動的変数に分類するとき, 人口統計的変数に分類されるものはどれか。", "c": ["社交性などの性格", "職業", "人口密度", "製品の使用割合"], "a": 1, "e": "人口統計的変数は年齢・性別・職業・所得など。人口密度は地理的変数、性格は心理的変数、使用割合は行動的変数。"}, {"id": "23aK27", "src": "令和5年秋 高度午前I(共通) 問27", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "オープンイノベーションの説明として, 適切なものはどれか。", "c": ["外部の企業に製品開発の一部を任せることで, 短期間で市場へ製品を投入する。", "顧客に提供する製品やサービスを自社で開発することで, 新たな価値を創出する。", "自社と外部組織の技術やアイディアなどを組み合わせることで創出した価値を,さらに外部組織へ提供する。", "自社の業務の工程を見直すことで, 生産性向上とコスト削減を実現する。"], "a": 2, "e": "オープンイノベーションは社外の技術やアイディアを組み合わせて価値を創出し、外部にも展開すること。"}, {"id": "23aK28", "src": "令和5年秋 高度午前I(共通) 問28", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "スマートファクトリーで使用される AI を用いたマシンビジョンの目的として, 適切なものはどれか。", "c": ["作業者が装着した VR ゴーグルに作業プロセスを表示することによって, 作業効率を向上させる。", "従来の人間の目視検査を自動化し, 検査効率を向上させる。", "需要予測を目的として, クラウドに蓄積した入出荷データを用いて機械学習を行い, 生産数の最適化を行う。", "設計変更内容を, AI を用いて吟味して, 製造現場に正確に伝達する。"], "a": 1, "e": "マシンビジョンはカメラ画像とAIで、人の目視検査を自動化する。"}, {"id": "23aK29", "src": "令和5年秋 高度午前I(共通) 問29", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "発生した故障について, 発生要因ごとの件数の記録を基に, 故障発生件数で上位を占める主な要因を明確に表現するのに適している図法はどれか。", "c": ["特性要因図", "パレート図", "マトリックス図", "連関図"], "a": 1, "e": "件数の多い順に棒グラフと累積比率を描き、主要因を示すのはパレート図。"}, {"id": "23aK30", "src": "令和5年秋 高度午前I(共通) 問30", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "匿名加工情報取扱事業者が, 適正な匿名加工を行った匿名加工情報を第三者提供す          |る際の義務として, 個人情報保護法に規定されているものはどれか。", "c": ["第三者に提供される匿名加工情報に含まれる個人に関する情報の項目及び提供方法を公表しなければならない。", "第三者へ提供した場合は, 速やかに個人情報保護委員会へ提供した内容を報告しなければならない。", "第三者への提供の手段は ハードコピーなどの物理的な媒体を用いることに限られる。", "匿名加工情報であっても, 第三者提供を行う際には事前に本人の承諾が必要である。"], "a": 0, "e": "匿名加工情報を第三者提供するときは、含まれる情報の項目と提供方法を公表し、相手に匿名加工情報である旨を明示する。本人同意は不要。"}, {"id": "23aS1", "src": "令和5年秋 午前II 問1", "exam": "A-2", "cat": "攻撃手法・対策", "q": "Web アプリケーションソフトウェアの脆弱性を悪用する攻撃手法のうち, 入力した文字列が PHP の exec 関数などに渡されることを利用し, 不正にシェルスクリプトを実行させるものは, どれに分類されるか。", "c": ["HTTP ヘッダインジェクション", "OS コマンドインジェクション", "クロスサイトリクエストフォージェリ", "セッションハイジャック"], "a": 1, "e": "入力をexec等に渡してシェルコマンドを実行させるのはOSコマンドインジェクション。"}, {"id": "23aS2", "src": "令和5年秋 午前II 問2", "exam": "A-2", "cat": "暗号・認証", "q": "TLS 1.3 の暗号スイートに関する説明のうち, 適切なものはどれか。", "c": ["AEAD (Authenticated Encryption with Associated Data) とハッシュアルゴリズムの組みで構成されている。", "TLS 1.2 で規定されている共通鍵暗号 AES-CBC をサポート必須の暗号アルゴリズムとして継続利用できるようにしている。", "Wi-Fi アライアンスにおいて規格化されている。", "サーバとクライアントのそれぞれがお互いに別の暗号アルゴリズムを選択できる。"], "a": 0, "e": "TLS1.3の暗号スイートはAEAD(AES-GCM等)とHKDF用ハッシュの組。鍵交換と署名は別にネゴシエートする。"}, {"id": "23aS3", "src": "令和5年秋 午前II 問3", "exam": "A-2", "cat": "暗号・認証", "q": "VA (Validation Authority) の役割はどれか。", "c": ["属性証明書の発行を代行する。", "デジタル証明書にデジタル署名を付与する。", "デジタル証明書の失効状態についての問合せに応答する。", "本人確認を行い デジタル証明書の発行を指示する。"], "a": 2, "e": "VA(検証局)は証明書の失効状態の問合せに応答する(OCSPレスポンダ等)。エはRA、イはCA。"}, {"id": "23aS4", "src": "令和5年秋 午前II 問4", "exam": "A-2", "cat": "暗号・認証", "q": "XML デジタル署名の特徴として, 適切なものはどれか。", "c": ["XML 文書中のエレメントに対するデタッチ署名 (Detached Signature) を作成し,同じ XML 文書に含めることができる。", "エンベローピング署名 (Enveloping Signature) では一つの署名対象に複数の署名を付与する。", "署名の書式として, CMS (Cryptographic Message Syntax) を用いる。", "デジタル署名では, 署名対象と署名アルゴリズムを ASN.1 によ って記述する。"], "a": 0, "e": "XML署名ではデタッチ署名を同じ文書内の別要素に対して作成し、同じXMLに含められる。CMSやASN.1は使わない。"}, {"id": "23aS5", "src": "令和5年秋 午前II 問5", "exam": "A-2", "cat": "攻撃手法・対策", "q": "クリプトジャッキングに該当するものはどれか。", "c": ["PC に不正アクセスし, その PC のリソースを利用して, 暗号資産のマイニングを行う攻撃", "暗号資産取引所の Web サイトに不正ログインを繰り返し, 取引所の暗号資産を盗む攻撃", "巧妙に細工した電子メールのやり取りによって, 企業の担当者をだまし, 攻撃者の用意した暗号資産口座に送金させる攻撃", "マルウェア感染した PC に制限を掛けて利用できないようにし, その制限の解除と引換えに暗号資産を要求する攻撃"], "a": 0, "e": "クリプトジャッキングは他人のPCの計算資源を無断で使って暗号資産をマイニングする攻撃。エはランサムウェア、ウはBEC。"}, {"id": "23aS6", "src": "令和5年秋 午前II 問6", "exam": "A-2", "cat": "攻撃手法・対策", "q": "マルウェアMirai の動作はどれか。", "c": ["IoT 機器などで動作する Web サーバプログラムの脆弱性を悪用して感染を広げ,Web ページを改ざんし, 決められた日時に特定の IP アドレスに対して DDoS 攻撃を行う。", "Web サーバプログラムの脆弱性を悪用して企業の Web ページに不正な JavaScriptを挿入し, 当該 Web ページを閲覧した利用者を不正な Web サイトへと誘導する。", "ファイル共有ソフトを使っている PC 内でマルウェアの実行ファイルを利用者が誤って実行すると, PC 内の情報をインターネット上の Web サイトにアップロードして不特定多数の人に公開する。", "ランダムな宛先 IP アドレスを使用して IoT 機器などに感染を広げるとともに,C&C サーバからの指令に従って標的に対して DDoS 攻撃を行う。"], "a": 3, "e": "Miraiはランダムなアドレスに対してTelnet等で脆弱なIoT機器を探索して感染を広げ、C&Cからの指令でDDoS攻撃を行う。"}, {"id": "23aS7", "src": "令和5年秋 午前II 問7", "exam": "A-2", "cat": "攻撃手法・対策", "q": "インターネットバンキングでの MITB 攻撃による不正送金について, 対策として用いられるトランザクション署名の説明はどれか。", "c": ["携帯端末からの送金取引の場合, 金融機関から利用者の登録メールアドレスに送金用のワンタイムパスワードを送信する。", "特定認証業務の認定を受けた認証局が署名したデジタル証明書をインターネットバンキングでの利用者認証に用いることによって, ログインパスワードが漏えいした際の不正ログインを防止する。", "利用者が送金取引時に, \"送金操作を行う PC とは別のデバイスに振込先口座番号などの取引情報を入力して表示された値”\" をインターネットバンキングに送信する。", "ログイン時に, 送金操作を行う PC とは別のデバイスによって, 一定時間だけ有効なログイン用のワンタイムパスワードを算出し, インターネットバンキングに送信する。"], "a": 2, "e": "トランザクション署名は振込先口座などを別デバイスに入力し、得られた値を送信して、改ざんされていないかを銀行側が検証する。"}, {"id": "23aS8", "src": "令和5年秋 午前II 問8", "exam": "A-2", "cat": "暗号・認証", "q": "SAML (Security Assertion Markup Language) の説明はどれか。", "c": ["Web サーバにある利用者のリソースに, Web サーバに限らない他のサーバが利用者に代わってアクセスすることを許可するための認証プロトコル", "異なるインターネットドメイン間でセキュリティ情報を共有してシングルサインオンに利用するための, XML をベースにした標準規格", "利用者 ID として URL 又は XRI (Extensible Resource Identifier) だけを使用することができ, 一つの利用者 ID で様々な Web サイトにログインできる仕組み", "利用者が文書やデータの属性情報や論理構造を定義する言語である SGML を, インターネット用に最適化したもの"], "a": 1, "e": "SAMLは異なるドメイン間でセキュリティ情報を共有し、SSOに使うXMLベースの標準。アはOAuth、ウはOpenID(旧)。"}, {"id": "23aS9", "src": "令和5年秋 午前II 問9", "exam": "A-2", "cat": "暗号・認証", "q": "公開鍵基盤における CPS (Certification Practice Statement) に該当するものはどれか。", "c": ["認証局が発行するデジタル証明書の所有者が策定したセキ", "認証局でのデジタル証明書発行手続を代行する事業者が策定したセキ", "認証局の認証業務の運用などに関する詳細を規定した文書", "認証局を監査する第三者機関の運用などに関する詳細を規定した文"], "a": 2, "e": "CPS(認証局運用規程)は、認証局の認証業務の運用などに関する詳細を定めた文書。"}, {"id": "23aS11", "src": "令和5年秋 午前II 問11", "exam": "A-2", "cat": "管理・法規・標準", "q": "JIS Q 27000:2019 (情報セキュリティ マネジメントシステムー用語) の用語に関する記述のうち, 適切なものはどれか。", "c": ["脅威とは, 一つ以上の要因によって付け込まれる可能性がある, 資産又は管理策の弱点のことである。", "脆弱性とは, システム又は組織に損害を与える可能性がある, 望ましくないインシデントの潜在的な原因のことである。", "リスク対応とは, リスクの大きさが, 受容可能か又は許容可能かを決定するために, リスク分析の結果をリスク基準と比較するプロセスのことである。", "リスク特定とは, リスクを発見, 認識及び記述するプロセスのことであり, リスク源, 事象. それらの原因及び起こり得る結果の特定が含まれる。"], "a": 3, "e": "JIS Q 27000の「リスク特定」はリスクを発見・認識・記述するプロセス。アは脆弱性、イは脅威、ウはリスク評価の説明。"}, {"id": "23aS12", "src": "令和5年秋 午前II 問12", "exam": "A-2", "cat": "管理・法規・標準", "q": "脆弱性管理, 測定, 評価を自動化するために NIST が策定した基準はどれか。", "c": ["FIPS (Federal Information Processing Standards)", "SCAP (Security Content Automation Protocol)", "SIEM (Security Information and Event Management)", "SOAR (Security Orchestration, Automation and Response)"], "a": 1, "e": "SCAPはNISTが策定した、脆弱性管理や測定・評価を自動化するための基準群(CVE、CVSS、CPEなど)。"}, {"id": "23aS13", "src": "令和5年秋 午前II 問13", "exam": "A-2", "cat": "Web・メール・DNS", "q": "DNSSEC に関する記述のうち, 適切なものはどれか。", "c": ["権威 DNS サーバが, DNS 問合せに対する応答時に, リソースレコードを公開鍵暗号方式で暗号化することによって, 通信経路上の盗聴を防ぐ。", "権威DNS サーバが, リソースレコードの受信時にデジタル署名を検証することによって, データの作成元の正当性とデータの完全性を確認する。", "リゾルバが, DNS 問合せに対する応答時に, リソースレコードを公開鍵暗号方式で暗号化することによって, 通信経路上の盗聴を防ぐ。", "リゾルバが, リソースレコードの受信時にデジタル署名を検証することによって,データの作成元の正当性とデータの完全性を確認する。"], "a": 3, "e": "DNSSECの検証はリゾルバ(キャッシュサーバ)が、受信したリソースレコードの署名を検証して行う。暗号化はしない。"}, {"id": "23aS14", "src": "令和5年秋 午前II 問14", "exam": "A-2", "cat": "暗号・認証", "q": "OAuth 2.0 に関する記述のうち, 適切なものはどれか。", "c": ["認可を行うためのプロトコルであり, 認可サーバが, アクセスしてきた者が利用者 (リソースオーナー) 本人であるかどうかを確認するためのものである。", "認可を行うためのプロトコルであり, 認可サーバが, 利用者 (リソースオーナー) の許可を得て, サービス (クライアント) に対し, 適切な権限を付与するためのものである。", "認証を行うためのプロトコルであり, 認証サーバが, アクセスしてきた者が利用者 (リソースオーナー) 本人であるかどうかを確認するためのものである。", "認証を行うためのプロトコルであり, 認証サーバが, 利用者 (リソースオーナー) の許可を得て, サービス (クライアント) に対し, 適切な権限を付与するためのものである。"], "a": 1, "e": "OAuth2.0は認可のプロトコルで、リソースオーナーの許可のもと、認可サーバがクライアントにアクセストークンを発行する。"}, {"id": "23aS15", "src": "令和5年秋 午前II 問15", "exam": "A-2", "cat": "ネットワーク", "q": "通信の暗号化や利用者の認証の機能をもち, 遠隔にあるコンピュータに安全にログインするためのプロトコルはどれか。", "c": ["L2TP", "LDAP", "RADIUS", "SSH"], "a": 3, "e": "暗号化と認証の機能を持つ安全なリモートログインのプロトコルはSSH。"}, {"id": "23aS16", "src": "令和5年秋 午前II 問16", "exam": "A-2", "cat": "Web・メール・DNS", "q": "電子メールをスマートフォンのメール・アプリケーションプログラムで受信する際のメールサーバとスマートフォンとの間の通信を, メール本文を含めて暗号化するプロトコルはどれか。", "c": ["APOP", "IMAPS", "POP3", "SMTP Submission"], "a": 1, "e": "IMAPS(IMAP over TLS)は受信通信を本文まで暗号化する。APOPはパスワードだけを保護する。"}, {"id": "23aS18", "src": "令和5年秋 午前II 問18", "exam": "A-2", "cat": "ネットワーク", "q": "クラス C のネットワークを, 59 ノードずつ収納できる四つのサブネットに分割した場合のサブネットマスクはどれか。", "c": ["255.255.255.0", "255.255.255.64", "255.255.255.128", "255.255.255.192"], "a": 3, "e": "50ノード＋ネットワークアドレス＋ブロードキャストで64アドレス必要。4分割は/26なので255.255.255.192。"}, {"id": "23aS19", "src": "令和5年秋 午前II 問19", "exam": "A-2", "cat": "ネットワーク", "q": "複数ノードから成るグループにマルチキャストでデータを送るときに, 宛先として使用できる IP アドレスはどれか。", "c": ["10.0.1.1", "127.0.1.1", "192.168.1.1", "239.0.1.1"], "a": 3, "e": "マルチキャストはクラスD(224〜239)。239.0.1.1が該当。127は自分自身(ループバック)、192.168はプライベートアドレス。"}, {"id": "23aS20", "src": "令和5年秋 午前II 問20", "exam": "A-2", "cat": "ネットワーク", "q": "DHCP のクライアントが, サーバから配布された IPv4 アドレスを, クライアント自身のホストアドレスとして設定する際に, そのアドレスが他のホストに使用されていないことを, クライアント自身でも確認することが推奨されている。 この確認に使用するプロトコルとして, 適切なものはどれか。", "c": ["ARP", "DNS", "ICMP", "RARP"], "a": 0, "e": "DHCPで割り当てられたアドレスが他で使われていないかは、ARP(Gratuitous ARP/ARP Probe)で確認する。"}, {"id": "23aS21", "src": "令和5年秋 午前II 問21", "exam": "A-2", "cat": "開発・DB・運用", "q": "DBMS のデータディクショナリはどれか。", "c": ["DBMS 内部でのソートデータ, サブクエリを展開したデータなど, 一時的なデータを格納したもの", "障害が発生した場合にバックアップを取った時点まで回復させるため, データベース自体の複製を格納したもの", "データベースに関するユーザー情報, データ構造など, データベース管理情報を格納したもの", "ユーザーからの指示によるデータベースの読込み情報, 書込み情報などを格納したもの"], "a": 2, "e": "データディクショナリは表定義・ユーザー情報などのメタデータ(DB管理情報)を格納したもの。"}, {"id": "23aS22", "src": "令和5年秋 午前II 問22", "exam": "A-2", "cat": "開発・DB・運用", "q": "目的別のサービスが多数連携して動作する大規模な分散型のシステムでは, 障害時の挙動を予知することが困難である。このようなシステムにおいて, ステージング環境や本番環境で意図的に障害を引き起こしてシステムの挙動を観察し, 発見した問題を修正することを継続的に実施し, システムの耐障害性及びシステム運用の信頼性を高めていく手法はどれか。", "c": ["DevOps", "Infrastructure as Code", "カオスエンジニアリング", "テスト駆動開発"], "a": 2, "e": "本番相当の環境で意図的に障害を起こし、システムの耐障害性を高めるのはカオスエンジニアリング。"}, {"id": "23aS23", "src": "令和5年秋 午前II 問23", "exam": "A-2", "cat": "開発・DB・運用", "q": "アジャイル開発手法の説明のうち, スクラムのものはどれか。", "c": ["コミュニケーション, シンプル, フィードバック, 勇気, 尊重の五つの価値を基礎とし, テスト駆動型開発, ペアプログラミング, リファクタリングなどのプラクティスを推奨する。", "推測 (プロジェクト立上げ, 適応的サイクル計画), 協調 (並行コンポーネント開発), 学習 (品質レビュー, 最終0Aプリリース) のライフサイクルをもつ。", "プロダクトオーナーなどの役割, スプリントレビューなどのイベント, プロダクトバックログなどの作成物, 及びルールから成る。", "モデルの全体像を作成した上で, 優先度を付けた詳細なフィーチャリストを作成し, フィーチャを単位として計画し, フィーチャごとの設計と構築とを繰り返す。"], "a": 2, "e": "スクラムはプロダクトオーナー等の役割、スプリント等のイベント、バックログ等の作成物とルールから成る。アはXP、エはFDD。"}, {"id": "23aS24", "src": "令和5年秋 午前II 問24", "exam": "A-2", "cat": "開発・DB・運用", "q": "JIS Q 20000-1:2020 (サービスマネジメントシステム要求事項) を適用している組織において, サービスマネジメントシステム (SMS) が次の要求事項に適合している状況にあるか否かに関する情報を提供するために, あらかじめ定めた間隔で組織が実施するものはどれか。〔要求事項〕・SMS に関して, 組織自体が規定した要求事項・JIS Q 20000-1:2020 の要求事項", "c": ["監視, 測定, 分析及び評価", "サービスの報告", "内部監査", "マネジメントレビ"], "a": 2, "e": "SMSが要求事項に適合しているかの情報を、あらかじめ定めた間隔で得るために行うのは内部監査。"}, {"id": "23aS25", "src": "令和5年秋 午前II 問25", "exam": "A-2", "cat": "開発・DB・運用", "q": "データベースの直接修正に関して, 監査人が, システム監査報告書で報告すべき指摘事項はどれか。ここで, 直接修正とは, アプリケーションソフトウェアの機能を経由せずに, 特権 ID を使用してデータを追加, 変更又は削除することをいう。", "c": ["更新ログ上は, アプリケーションソフトウェアの機能を経由したデータ更新として記録していた。", "事前のデータ変更申請の承認, 及び事後のデータ変更結果の承認を行っていた。", "直接修正の作業終了時には, 直接修正用の特権 ID を無効にしていた。", "利用部門からのデータ変更依頼票に基づいて, システム部門が直接修正を実施していた。"], "a": 0, "e": "直接修正なのに、ログ上はアプリ経由の更新に見える状態では追跡ができないため、指摘事項になる。イとウは適切な統制。"}, {"id": "23hS1", "src": "令和5年春 午前II 問1", "exam": "A-2", "cat": "暗号・認証", "q": "デジタル庁, 総務省及び経済産業省が策定した “電子政府における調達のために参照すべき暗号のリスト (CRYPTREC 暗号リスト)” に関する記述のうち, 適切なものはどれか。", "c": ["CRYPTREC 暗号リストにある運用監視暗号リストとは, 運用監視システムにおける利用実績が十分であると判断され, 電子政府において利用を推奨する暗号技術のリストである。", "CRYPTREC 暗号リストにある証明書失効リストとは, 政府共用認証局が公開している, 危殆化した暗号技術のリストである。", "CRYPTREC 暗号リストにある推奨候補暗号リストとは, 安全性及び実装性能が確認され, 今後, 電子政府推奨暗号リストに掲載される可能性がある暗号技術のリストである。", "CRYPTREC 暗号リストにある電子政府推奨暗号リストとは, 互換性維持目的に限った継続利用を推奨する暗号技術のリストである。"], "a": 2, "e": "CRYPTREC暗号リストの「推奨候補暗号リスト」は、安全性と実装性能が確認され、今後電子政府推奨暗号リストに載る可能性がある暗号。"}, {"id": "23hS2", "src": "令和5年春 午前II 問2", "exam": "A-2", "cat": "攻撃手法・対策", "q": "Pass the Hash 攻撃はどれか。", "c": ["パスワードのハッシュ値から導出された平文パスワードを使ってログインする。", "パスワードのハッシュ値だけでログインできる仕組みを悪用してログインする。", "パスワードを固定し, 利用者 ID の文字列のハッシュ化を繰り返しながら様々な利用者 ID を試してログインする。", "ハッシュ化されずに保存されている平文パスワードを使ってログインする。"], "a": 1, "e": "Pass the Hashは、NTLM認証などハッシュ値だけで認証できる仕組みを悪用し、窃取したハッシュでログインする攻撃。"}, {"id": "23hS3", "src": "令和5年春 午前II 問3", "exam": "A-2", "cat": "暗号・認証", "q": "シングルサインオンの実装方式の一つである SAML 認証の流れとして, 適切なものはどれか。", "c": ["IdP (Identity Provider) が利用者認証を行い, 認証成功後に発行されるアサーションを SP (Service Provider) が検証し, 問題がなければクライアントが SP にアクセスする。", "Web サーバに導入されたエージェントが認証サーバと連携して利用者認証を行い,クライアントは認証成功後に利用者に発行される cookie を使用して SP にアクセスする。", "認証サーバは Kerberos プロトコルを使って利用者認証を行い, クライアントは認証成功後に発行されるチケットを使用して SP にアクセスする。", "リバースプロキシで利用者認証が行われ, クライアントは認証成功後にリバースプロキシ経由で SP にアクセスする。"], "a": 0, "e": "SAMLではIdPが利用者を認証してアサーションを発行し、SPがそれを検証してアクセスを許可する。ウはKerberos、エはリバースプロキシ方式。"}, {"id": "23hS4", "src": "令和5年春 午前II 問4", "exam": "A-2", "cat": "暗号・認証", "q": "ハッシュ関数の性質の一つである衝突発見困難性に関する記述のうち, 適切なものはどれか。", "c": ["SHA-256 の衝突発見困難性を示す, ハッシュ値が一致する二つの元のメッセージの発見に要する最大の計算量は, 256 の 2 乗である。", "SHA-256 の衝突発見困難性を示す, ハッシュ値の元のメッセージの発見に要する最大の計算量は, 2 の 256 乗である。", "衝突発見困難性とは. ハッシュ値が与えられたときに, 元のメッセージの発見に要する計算量が大きいことによる, 発見の困難性のことである。", "衝突発見困難性とは, ハッシュ値が一致する二つの元のメッセージの発見に要する計算量が大きいことによる, 発見の困難性のことである。"], "a": 3, "e": "衝突発見困難性は、同じハッシュ値になる2つのメッセージを見つけにくい性質。ハッシュ値から元を求めにくいのは原像計算困難性。"}, {"id": "23hS5", "src": "令和5年春 午前II 問5", "exam": "A-2", "cat": "Web・メール・DNS", "q": "DNS に対するカミンスキー攻撃 (Kaminsky's attack) への対策はどれか。", "c": ["DNS キャッシュサーバと権威 DNS サーバとの計 2 台の冗長構成とすることによって, 過負荷によるサーバダウンのリスクを大幅に低減させる。", "SPF (Sender Policy Framework) を用いて DNS リソースレコードを認証することによって, 電子メールの送信元ドメインが詐称されていないかどうかを確認する。", "問合せ時の送信元ポート番号をランダム化することによって, DNS キャッシュサーバに偽の情報がキャッシュされる確率を大幅に低減させる。", "プレースホルダを用いたエスケープ処理を行うことによって, 不正な SQL 構文による DNS リソースレコードの書換えを防ぐ。"], "a": 2, "e": "カミンスキー攻撃(DNSキャッシュポイズニング)への対策は、送信元ポートのランダム化(とDNSSEC)。"}, {"id": "23hS6", "src": "令和5年春 午前II 問6", "exam": "A-2", "cat": "暗号・認証", "q": "デジタル証明書に関する記述のうち, 適切なものはどれか。", "c": ["S/MIME や TLS で利用するデジタル証明書の規格は, ITU-T X.400 で標準化されている。", "TLS において, デジタル証明書は, 通信データの暗号化のための鍵交換や通信相手の認証に利用されている。", "認証局が発行するデジタル証明書は, 申請者の秘密鍵に対して認証局がデジタル署名したものである。", "ルート認証局は, 下位の認証局の公開鍵にルート認証局の公開鍵でデジタル署名したデジタル証明書を発行する。"], "a": 1, "e": "TLSでサーバ証明書は、相手の認証と鍵交換に使われる。証明書の規格はX.509で、CAは申請者の公開鍵に署名する。"}, {"id": "23hS7", "src": "令和5年春 午前II 問7", "exam": "A-2", "cat": "暗号・認証", "q": "ブロック暗号の暗号利用モードの一つである CTR (Counter) モードに関する記述のうち, 適切なものはどれか。", "c": ["暗号化と復号の処理において, 出力は, 入力されたブロックと鍵ストリームとの排他的論理和である。", "暗号化の処理において, 平文のデータ長がブロック長の倍数でないときにパディングが必要である。", "ビット誤りがある暗号文を復号すると, ビット誤りのあるブロック全体と次のブロックの対応するビットが平文ではビット誤りになる。", "複数ブロックの暗号化の処理は並列に実行できないが, 複数ブロックの復号の処理は並列に実行できる。"], "a": 0, "e": "CTRモードはカウンタを暗号化した鍵ストリームとXORする。パディング不要で並列処理が可能、ビット誤りは同じビットにしか影響しない。"}, {"id": "23hS8", "src": "令和5年春 午前II 問8", "exam": "A-2", "cat": "管理・法規・標準", "q": "政府情報システムのためのセキュリティ評価制度に用いられる “ISMAP 管理基準\"が基礎としているものはどれか。", "c": ["FIPS 140-3 (暗号モジュールのセキュリティ要求事項)", "TS0/IEC 27918:2019 (個人識別情報 (PL{) プロセッサとして作動するパブリッククラウドにおける PII の保護のための実施基準)", "JIS Q 150901:2617 (個人情報保護マネジメントシステムー要求事項)", "日本セキュリティ監査協会 \"クラウド情報セキュリティ管理基準 (平成 28 年度版\""], "a": 3, "e": "ISMAP管理基準は、JASA「クラウド情報セキュリティ管理基準(平成28年度版)」を基礎としている。"}, {"id": "23hS11", "src": "令和5年春 午前II 問11", "exam": "A-2", "cat": "攻撃手法・対策", "q": "サイドチャネル攻撃の手法であるタイミング攻撃の対策として, 最も適切なものはどれか。", "c": ["演算アルゴリズムに処理を追加して, 秘密情報の違いによって演算の処理時間に差異が出ないようにする。", "故障を検出する機構を設けて, 検出したら秘密情報を破壊する。", "コンデンサを挿入して, 電力消費量が時間的に均一になるようにする。", "保護層を備えて, 内部のデータが不正に書き換えられないようにする。"], "a": 0, "e": "タイミング攻撃の対策は、秘密情報によって処理時間が変わらないようにすること(定数時間実装)。ウは電力解析の対策。"}, {"id": "23hS12", "src": "令和5年春 午前II 問12", "exam": "A-2", "cat": "攻撃手法・対策", "q": "インラインモードで動作するシグネチャ型 IPS の特徴はどれか。", "c": ["IPS が監視対象の通信経路を流れる全ての通信パケットを経路外からキャプチャできるように通信経路上のスイッチのミラーポートに接続され, 通常時の通信から外れた通信を不正と判断して遮断する。", "IPS が監視対象の通信経路を流れる全ての通信パケットを経路外からキャプチャできるように通信経路上のスイッチのミラーポートに接続され, 定義した異常な通信と合致する通信を不正と判断して遮断する。", "IPS が監視対象の通信を通過させるように通信経路上に設置され, 通常時の通信から外れた通信を不正と判断して遮断する。", "IPS が監視対象の通信を通過させるように通信経路上に設置され, 定義した異常な通信と合致する通信を不正と判断して遮断する。"], "a": 3, "e": "インラインモードは通信経路上に設置する方式。シグネチャ型は定義した異常パターンに一致する通信を遮断する。ウはアノマリ型。"}, {"id": "23hS13", "src": "令和5年春 午前II 問13", "exam": "A-2", "cat": "攻撃手法・対策", "q": "マルウェア感染の調査対象の PC に対して, 電源を切る前に全ての証拠保全を行いたい。ARP キャッシュを取得した後に保全すべき情報のうち, 最も優先して保全すべきものはどれか。", "c": ["調査対象の PC で動的に追加されたルーティングテーブル", "調査対象の PCに増設された HDD にある個人情報を格納したテキストファイル", "調査対象の PC のVPN接続情報を記録している VPN サーバ内のログ", "調査対象の PC のシステムログファイル"], "a": 0, "e": "証拠保全は揮発性の高い順に行う。ARPキャッシュの次は、メモリ上のルーティングテーブル。"}, {"id": "23hS14", "src": "令和5年春 午前II 問14", "exam": "A-2", "cat": "ネットワーク", "q": "無線 LAN の暗号化通信を実装するための規格に関する記述のうち, 適切なものはどれか。", "c": ["EAP は, クライアント PC とアクセスポイントとの間で, あらかじめ登録した共通鍵による暗号化通信を実装するための規格である。", "RADIUS は, クライアント PC とアクセスポイントとの間で公開鍵暗号方式による暗号化通信を実装するための規格である。", "SSID は, クライアント PC で利用する秘密鍵であり, 公開鍵暗号方式による暗号化通信を実装するための規格で規定されている。", "WPA3-Enterprise は, IEEE 802.1X の規格に沿った利用者認証及び動的に配布される暗号化鍵を用いた暗号化通信を実装するための規格である。"], "a": 3, "e": "WPA3-EnterpriseはIEEE 802.1Xで利用者を認証し、動的に配布される鍵で暗号化する。"}, {"id": "23hS15", "src": "令和5年春 午前II 問15", "exam": "A-2", "cat": "Web・メール・DNS", "q": "DKIM (DomainKeys Identified Mail) の説明はどれか。", "c": ["送信側メールサーバにおいてデジタル署名を電子メールのヘッダーに付加し, 受信側メールサーバにおいてそのデジタル署名を公開鍵によって検証する仕組み", "送信側メールサーバにおいて利用者が認証された場合, 電子メールの送信が許可される仕組み", "電子メールのヘッダーや配送経路の情報から得られる送信元情報を用いて, 電子メールの送信元の IP アドレスを検証する仕組み", "ネットワーク機器において, 内部ネットワークから外部のメールサーバの TCP ポート番号 25 への直接の通信を禁止する仕組み"], "a": 0, "e": "DKIMは送信側サーバがヘッダーに署名を付加し、受信側がDNSで公開された公開鍵で検証する。"}, {"id": "23hS16", "src": "令和5年春 午前II 問16", "exam": "A-2", "cat": "Web・メール・DNS", "q": "インターネットサービスプロバイダ (ISP) が, OP25B を導入する目的の一つはどれか。", "c": ["ISP 管理外のネットワークに対する ISP 管理下のネットワークからの ICMP パケットによる DDoS 攻撃を遮断する。", "ISP 管理外のネットワークに向けて ISP 管理下のネットワークから送信されるスパムメールを制限する。", "ISP 管理下のネットワークに対する ISP 管理外のネットワークからの ICMP パケットによる DDoS 攻撃を遮断する。", "ISP 管理下のネットワークに向けて ISP 管理外のネットワークから送信されるスパムメールを制限する。"], "a": 1, "e": "OP25BはISP管理下の動的IPから外部の25番ポートへの直接送信を止め、スパムの送信を制限する。"}, {"id": "23hS19", "src": "令和5年春 午前II 問19", "exam": "A-2", "cat": "ネットワーク", "q": "スパニングツリープロトコルが適用されている複数のブリッジから成るネットワークにおいて, 任意の一つのリンクの両端のブリッジのうち, ルートブリッジまでの経路コストが小さいブリッジの側にあるポートを何と呼ぶか。", "c": ["アクセスポート (Access Port)", "代表ポート (Designated Port)", "トランクポート (Trunk Port)", "ルートポート (Root Port)"], "a": 1, "e": "リンクの両端のうちルートブリッジに近い(コストが小さい)側のポートが代表ポート。ルートポートは各ブリッジでルートに最も近いポート。"}, {"id": "23hS21", "src": "令和5年春 午前II 問21", "exam": "A-2", "cat": "開発・DB・運用", "q": "次のSQL 文を A表の所有者が発行したときの, 利用者B へのA表に関する権限の付与を説明したものはどれか。GRANT ALL PRIVILEGES ON A TO B WITH GRANT OPTION", "c": ["SELECT 権限, UPDATE 権限, INSERT 権限, DELETE 権限などの全ての権限, 及びそれらの付与権を付与する。", "SELECT 権限, UPDATE 権限, INSERT 権限, DELETE 権限などの全ての権限を付与するが, それらの付与権は付与しない。", "SELECT 権限, UPDATE 権限, INSERT 権限。DELETE 権限は付与しないが, それらの付与権だけを付与する。", "SELECT 権限, 及び SELECT 権限の付与権を付与するが, UPDATE 権限, INSERT 権限, DELETE 権限, 及びそれらの付与権は付与しない。"], "a": 0, "e": "ALL PRIVILEGESで全ての権限を付与し、WITH GRANT OPTIONで、それを他者に付与する権利も与える。"}, {"id": "23hS24", "src": "令和5年春 午前II 問24", "exam": "A-2", "cat": "開発・DB・運用", "q": "サービスマネジメントにおける問題管理において実施する活動はどれか。", "c": ["インシデントの発生後に暫定的にサービスを復旧させ, 業務を継続できるようにする。", "インシデントの発生後に未知の根本原因を特定し, 恒久的な解決策を策定する。", "インシデントの発生に備えて, 復旧のための設計をする。", "インシデントの発生を記録し, 関係する部署に状況を連絡する。ー 笑デ"], "a": 1, "e": "問題管理はインシデントの根本原因を特定し、恒久的な解決策を策定する。アはインシデント管理。"}, {"id": "23hS25", "src": "令和5年春 午前II 問25", "exam": "A-2", "cat": "開発・DB・運用", "q": "システム監査基準 (平成 30 年) に基づくシステム監査において, リスクに基づく監査計画の策定 (リスクアプローチ) で考慮すべき事項として, 適切なものはどれか。", "c": ["監査対象の不備を見逃して監査の結論を誤る監査リスクを完全に回避する監査計画を策定する。", "情報システムリスクの大小にかかわらず, 全ての監査対象に対して一律に監査資源を配分する。", "情報システムリスクは, 情報システムに係るリスクと, 情報の管理に係るリスクの二つに大別されることに留意する。", "情報システムリスクは常に一定ではないことから, 情報システムリスクの特性の変化及び変化がもたらす影響に留意する。"], "a": 3, "e": "リスクアプローチでは、情報システムリスクは変化するものと捉え、その特性の変化と影響に留意する。監査リスクを完全に回避することはできない。"}, {"id": "24aK1", "src": "令和6年秋 高度午前I(共通) 問1", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "AI における教師あり学習での交差検証に関する記述はどれか。", "c": ["過学習を防ぐために, 回帰モデルに複雑さを表すペナルティ項を加え, 訓練データへ過剰に適合しないようにモデルを調整する。", "学習の精度を高めるために, 複数の異なるアルゴリズムのモデルで学習し, 学習の結果は組み合わせて評価する。", "学習モデルの汎化性能を高めるために, 単一のモデルで関連する複数の課題を学習することによって, 課題間に共通する要因を獲得する。", "学習モデルの汎化性能を評価するために, データを複数のグループに分割し, 一部を学習に残りを評価に使い, 順にグループを入れ替えて学習と評価を繰り返す。"], "a": 3, "e": "交差検証はデータを分割し、学習用と評価用を入れ替えながら汎化性能を評価する手法。アは正則化、イはアンサンブル、ウはマルチタスク学習。"}, {"id": "24aK5", "src": "令和6年秋 高度午前I(共通) 問5", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "Web アプリケーションサーバの信頼性に関する記述のうち, 適切なものはどれか。", "c": ["コールドスタンバイ構成で稼働しているサーバに障害が発生した場合, サービスは中断しないが, トランザクションは継続できない。", "コールドスタンバイ構成で稼働しているサーバに障害が発生した場合, サービスは中断するが, トランザクションは継続できる。", "セッションを共有しないクラスタ構成で 1 台のサーバに障害が発生した場合,サービスは継続できないが, トランザクションは継続できる。", "セッションを共有するクラスタ構成で 1 台のサーバに障害が発生した場合, サービス及びトランザクションは継続できる。"], "a": 3, "e": "セッションを共有するクラスタ構成なら、1台が故障しても他のサーバがサービスもトランザクションも引き継げる。"}, {"id": "24aK6", "src": "令和6年秋 高度午前I(共通) 問6", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "仮想記憶方式において, セグメンテーション方式と比較した場合のページング方式の長所はどれか。", "c": ["記憶領域へのアクセス保護を論理的な単位で行うことができる。", "記憶領域をプログラム間で容易に共用することができる。", "実行時に記憶領域の大きさを動的に変えることができる。", "主記憶の外部断片化が発生しない。"], "a": 3, "e": "ページングは固定長で管理するため、外部断片化が起きない(内部断片化は起こる)。ア〜ウはセグメンテーション方式の長所。"}, {"id": "24aK7", "src": "令和6年秋 高度午前I(共通) 問7", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "手続型言語のコンパイラがコード生成までに行う処理のうち, 最後に行うものはどれか。", "c": ["意味解析", "構文解析", "最適化", "字句解析"], "a": 2, "e": "コンパイルは字句解析→構文解析→意味解析→最適化→コード生成の順。コード生成の前に最後に行うのは最適化。"}, {"id": "24aK8", "src": "令和6年秋 高度午前I(共通) 問8", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "アクチュエーターの説明として, 適切なものはどれか。", "c": ["与えられた目標値と. センサーから得られた制御量を比較し, 制御量を目標値に一致させるように操作量を出力する。", "位置, 角度, 速度, 加速度, 力, 温度などを検出し, 電気的な情報に変換する。", "エネルギー源からのパワーを, 回転, 直進などの動きに変換する。", "マイクロフォン, センサーなどが出力する微小な電気信号を増幅する。"], "a": 2, "e": "アクチュエーターはエネルギーを回転や直進などの機械的な動きに変換する。イはセンサー、アはコントローラ。"}, {"id": "24aK11", "src": "令和6年秋 高度午前I(共通) 問11", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "DNS に関する記述のうち, 適切なものはどれか。", "c": ["DNS サーバのホスト名を登録するレコードをMX レコードという。", "DNS サーバに問い合わせを行うソフトウェアをレゾリューションという。", "IP アドレスに対応するホスト名を調べることを逆引きという。", "ホスト名に対し別名を登録するレコードを NS レコードという。"], "a": 2, "e": "IPアドレスからホスト名を調べるのは逆引き。MXはメールサーバ、NSはDNSサーバ、CNAMEは別名のレコード。"}, {"id": "24aK12", "src": "令和6年秋 高度午前I(共通) 問12", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "IPv4のLAN に接続されているプリンターの MAC アドレスを, 同一LAN 上のPC から調べるときに使用するコマンドはどれか。ここで, PC はこのプリンターを直前に使用しており, プリンターの IP アドレスは分かっているものとする。", "c": ["arp", "ipconfig又はifconfig", "netstat", "ping"], "a": 0, "e": "直前に通信した相手のMACアドレスはARPキャッシュに残っているので、arpコマンドで確認できる。"}, {"id": "24aK13", "src": "令和6年秋 高度午前I(共通) 問13", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "ディープフェイクを悪用 した攻撃に該当するものはどれか。", "c": ["AI 技術によって加工した CEO の音声を使用して従業員に電話をかけ, 指定した銀行口座に送金するよう指示した。", "企業の PC をランサムウェアに感染させ, 暗号化したデータを復号するための鍵と引き換えに, 指定した方法で暗号資産を送付するよう指示した。", "企業の秘密情報を含むデータを不正に取得したと誤認させる電子メールを従業員に送付し, 不正に取得したデータを公開しないことと引き換えに, 指定した方法で暗号資産を送付するよう指示した。", "ディープウェブにて入手した認証情報で CEO の電子メールアカウントに不正にログインして偽りの電子メールを従業員に送付し, 指定した銀行口座に送金するよう指示した。"], "a": 0, "e": "ディープフェイクはAIで音声や映像を偽造する技術。CEOの声を偽造して送金を指示するのが該当。"}, {"id": "24aK14", "src": "令和6年秋 高度午前I(共通) 問14", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "JVN などの脆弱性情報サイトで採用されている CVE (Common Vulnerabilities and Exposures) 識別子の説明はどれか。", "c": ["コンピュータで必要なセキュリティ設定項目を識別するための識別子", "脆弱性が悪用されて改ざんされた Web サイトのスクリーンショットを識別するための識別子", "製品に含まれる脆弱性を識別するための識別子", "セキュリティ製品の種別を識別するための識別子"], "a": 2, "e": "CVEは製品の個別の脆弱性を識別するための識別子(CVE-年-番号)。"}, {"id": "24aK15", "src": "令和6年秋 高度午前I(共通) 問15", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "DNS キャッシュポイズニング攻撃に対して有効な対策はどれか。", "c": ["DNS サーバにおいて, 侵入したマルウェアをリアルタイムに隔離する。", "DNS 問合せに使用する DNS ヘッダー内の ID を固定せずにランダムに変更する。", "DNS 問合せに使用する送信元ポート番号を 53 番に固定する。", "外部からのDNS 問合せに対しては, 宛先ポート番号 53 のものだけに応答する。"], "a": 1, "e": "キャッシュポイズニングへの対策は、DNSのトランザクションIDや送信元ポートをランダム化して推測しにくくすること。"}, {"id": "24aK16", "src": "令和6年秋 高度午前I(共通) 問16", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "エクスプロイトコードの説明はどれか。", "c": ["攻撃コードとも呼ばれ, ソフトウェアの脆弱性を悪用するコードのことであり.,使い方によっては脆弱性の検証に役立つこともある。", "マルウェア定義ファイルとも呼ばれ, マルウェアを特定するための特徴的なコードのことであり, マルウェア対策ソフトによるマルウェアの検知に用いられる。", "メッセージとシークレットデータから計算されるハッシュコードのことであり,メッセージの改ざん検知に用いられる。", "ログインのたびに変化する認証コードのことであり, 不正に取得しても再利用できないので不正アクセスを防ぐ。"], "a": 0, "e": "エクスプロイトコードは脆弱性を突く攻撃コード。脆弱性の検証に使われることもある。イはシグネチャ、ウはMAC。"}, {"id": "24aK17", "src": "令和6年秋 高度午前I(共通) 問17", "exam": "A-1", "cat": "テクノロジ(午前I)", "q": "ソフトウェアの使用性を評価する指標の目標設定の例として, 適切なものはどれか。", "c": ["ソフトウェアに障害が発生してから 1 時間以内に, 利用者が使用できること", "ソフトウェアの使用方法を, 利用者が 1時間以内に習得できること", "利用者から要望のある機能の改善を, 1 週間以内に完了できること", "利用者の使用したい機能が, 100 %提供できていること"], "a": 1, "e": "使用性(ユーザビリティ)は習得しやすさや使いやすさ。アは回復性(信頼性)、ウは保守性、エは機能適合性。"}, {"id": "24aK18", "src": "令和6年秋 高度午前I(共通) 問18", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "プロジェクトマネジメントにおけるスコープの管理の活動はどれか。", "c": ["開発ツールの新機能の教育が不十分と分かったので, 開発ツールの教育期間を 2日間延長した。", "要件定義が完了した時点で再見積りをしたところ, 当初見積もった開発コストを超過することが判明したので, 追加予算を確保した。", "連携する計画であった外部システムのリリースが延期になったので, この外部システムとの連携に関わる作業は別プロジェクトで実施することにした。", "割り当てたテスト担当者が期待した成果を出せなかったので, 経験豊富なテスト担当者と交代した。"], "a": 2, "e": "スコープの管理は作業範囲の変更をコントロールする活動。連携作業を別プロジェクトに切り出すのはスコープ変更。"}, {"id": "24aK19", "src": "令和6年秋 高度午前I(共通) 問19", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "プロジェクトマネジメントにおけるファストトラッキングの例として, 適切なものはどれか。", "c": ["クリティカルパス上のアクティビティの開始が遅れたので, そのアクティビティに人的資源を追加した。", "コストを削減するために, これまで承認されていた残業を禁止した。", "仕様の確定が大幅に遅れたので, プロジェクトの完了予定日を延期した。", "設計が終わったモジュールから順にプログラム開発を実施するようにして, スケジュールを短縮した。"], "a": 3, "e": "ファストトラッキングは本来は順番に行う作業を並行して進め、期間を短縮する。アはクラッシング。"}, {"id": "24aK20", "src": "令和6年秋 高度午前I(共通) 問20", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "サービスマネジメントにおいて, 中断したサービスを復旧させるときの目標を定めた指標に, RTO (目標復旧時間), RPO (目標復旧時点) 及び RLO (目標復旧レベル)がある。RT0 と RLO とを定めた例として, 適切なものはどれか。", "c": ["サービスが中断する 3 時間前の時点の状態にデータを復旧し, 利用者の 50%以上にサービスを提供できるようにする。", "サービスが中断する直前の状態にデータを復旧し, 当日のサービス終了時刻をサービスが中断していた時間だけ延長する。", "サービスの中断から 1時間以内に, 中断する 1時間前の時点の状態にデータを復旧する。", "サービスの中断から 1日以内に, 中断したサービスのうちの重要なサービスに限定してサービスを復旧する。"], "a": 3, "e": "RTOは復旧までの時間、RLOは復旧するサービスのレベル。「1日以内に重要サービスに限定して復旧」が両方を定めている。"}, {"id": "24aK21", "src": "令和6年秋 高度午前I(共通) 問21", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "システム監査において, 監査手続の適用に際して用いられる技法のうち, データの生成から入力, 処理, 出力, 活用までのプロセス, 及び組み込まれているコントロールを, 書面上で, 又は実際に追跡するものはどれか。", "c": ["ウォークスルー法", "チェックリスト法", "突合・照合法", "ドキュメントレビ"], "a": 0, "e": "データの生成から活用までのプロセスとコントロールを追跡するのはウォークスルー法。"}, {"id": "24aK22", "src": "令和6年秋 高度午前I(共通) 問22", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "システム監査基準 (令和 5 年) におけるフォローアップの説明として, 適切なものはどれか。", "c": ["監査対象先が, 監査報告書の指摘事項及び改善提案を基に改善計画の策定を行うこと", "監査部門の責任者が, 監査報告書を基に監査の実施状況と指摘事項の妥当性を確認すること", "システム監査人が, 監査報告書に記載した改善提案の実施状況に関する情報を収集し, 改善状況ををモニタリングすること", "システム監査人が, 時間の関係で調査が終了しなかった監査項目を追跡調査して報告すること"], "a": 2, "e": "フォローアップは、監査人が改善提案の実施状況について情報を集め、改善状況をモニタリングすること。"}, {"id": "24aK23", "src": "令和6年秋 高度午前I(共通) 問23", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "経済産業省が取りまとめた“デジタル経営改革のための評価指標 (DX 推進指標)\"によれば, DX を実現する上で基盤となる IT システムの構築に関する指標において,\"IT システムに求められる要素\"について経営者が確認すべき事項はどれか。", "c": ["IT システムの全体設計や協働できるベンダーの選定などを行える人材を育成・確保できているか。", "環境変化に迅速に対応し, 求められるデリバリースピードに対応できる IT システムとなっているか。", "データ処理において, リアルタイム性よりも, ビッグデータの蓄積と事後の分析が重視されているか。", "データを迅速に活用するために, 全体最適よりも, 個別最適を志向した IT システムとなっているか。"], "a": 1, "e": "DX推進指標の「ITシステムに求められる要素」では、環境変化に迅速に対応できるデリバリースピードがあるかを確認する。"}, {"id": "24aK25", "src": "令和6年秋 高度午前I(共通) 問25", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "UML の図のうち, 業務要件定義において, 業務フローを記述する際に使用する, 処理の分岐や並行処理, 処理の同期などを表現できる図はどれか。", "c": ["アクティビティ図", "クラス図", "状態マシン図", "ユースケース図"], "a": 0, "e": "分岐、並行処理、同期を含む業務フローを表現できるのはアクティビティ図。"}, {"id": "24aK26", "src": "令和6年秋 高度午前I(共通) 問26", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "コ・クリエーション戦略の特徴はどれか。", "c": ["企業の営業部門と製造部門が協働し, 特定の商品・サービスに限定して, 徹底的に自前主義にこだわることによって強みを発揮する。", "顧客が自らのアイデアを商品の仕様に具体的に落とし込み, 企業に製品を製造してもらう。", "顧客や企業ネットワークの力を活用し, 商品・サービスだけでなく, 顧客の経験までを含めて差別化可能な価値を創造する。", "自社に不足する経営資源をM&A によって強化し, 従来にない価値をより素早く創造する。"], "a": 2, "e": "コ・クリエーション(価値共創)は顧客やパートナーと協働し、顧客体験まで含めて価値を創る戦略。"}, {"id": "24aK27", "src": "令和6年秋 高度午前I(共通) 問27", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "企業における研究, 開発, 事業化, そして産業化へとステージが移行する過程の中で, 事業化から産業化に移行するときの, 競合製品との競争過程にある障壁を何と呼ぶか。", "c": ["キャズム", "死の谷", "ダーウィンの海", "魔の川"], "a": 2, "e": "研究→開発の障壁は「魔の川」、開発→事業化は「死の谷」、事業化→産業化は「ダーウィンの海」。"}, {"id": "24aK29", "src": "令和6年秋 高度午前I(共通) 問29", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "企業経営において, 経営理念, 経営戦略, 事業戦略は, 経営理念を最上位とするピラミッドを形成している。 経営理念, 経営戦略, 事業戦略の関係性で適切なものはどれか。", "c": ["経営理念, 経営戦略, 事業戦略のピラミッドは上位ほど具体的な内容であるのに対して, 下位にいくほど抽象的な内容となっている。", "経営理念, 経営戦略, 事業戦略のピラミッドは上位ほど短期的な視点であるのに対して, 下位にいくほど中長期的な視点となっている。", "経営理念を達成するために経営戦略を策定し, 経営戦略という目標を達成するために事業戦略に分解する。", "経営理念を達成するために事業戦略を策定し, 事業戦略という目標を達成するために経営戦略に分解する。"], "a": 2, "e": "経営理念を達成するために経営戦略を立て、それを事業戦略に分解する。上位ほど抽象的で長期的。"}, {"id": "24aK30", "src": "令和6年秋 高度午前I(共通) 問30", "exam": "A-1", "cat": "マネジメント・ストラテジ(午前I)", "q": "大規模なシステム開発を受注した A社では, 不足する開発要員を派遣事業者であるB 社からの労働者派遣によって補うことにした。A 社の行為のうち, 労働者派遣法に照らして適切なものはどれか。", "c": ["システム開発が長期間になることが予想されるので, 開発要員の派遣期間を 3年とする契約を結ぶ。", "派遣候補者の履歴書及び業務経歴書の提出を B 社に求め, 書類選考を行い, 面接対象者を絞り込む。", "派遣された要員が大きな作業負担を負うことが見込まれるので, B 社に 20 代男性の派遣を求める。", "派遣労働者がA社の指揮命令に対して申し立てた苦情に自社で対応せず, その処理を B 社に任せる。"], "a": 0, "e": "派遣期間の上限は原則3年。派遣先が労働者を特定(書類選考)したり、性別や年齢を指定したりするのは禁止。苦情には派遣先も対応する。"}, {"id": "24aS1", "src": "令和6年秋 午前II 問1", "exam": "A-2", "cat": "暗号・認証", "q": "RADIUS や Diameter が提供する AAA フレームワークの構成要素は, 認証(Authentication), 認可 (Authorization) と, もう一つはどれか。", "c": ["Accounting", "Activation", "Audit", "Augmented Reality"], "a": 0, "e": "AAAは認証(Authentication)、認可(Authorization)、アカウンティング(Accounting:利用記録・課金)。"}, {"id": "24aS2", "src": "令和6年秋 午前II 問2", "exam": "A-2", "cat": "攻撃手法・対策", "q": "AI による画像認識において, 認識させる画像の中に人間には知覚できないノイズや微小な変化を含めることによって, AI アルゴリズムの特性を悪用し, 誤認識させる攻撃はどれか。", "c": ["Adaptively Chosen Message 攻撃", "Adversarial Examples 攻撃", "Distributed Reflection Denial of Service 攻撃", "Model Inversion 攻撃"], "a": 1, "e": "人に分からない微小なノイズで、AIに誤認識させるのはAdversarial Examples攻撃。エは学習データを推定する攻撃。"}, {"id": "24aS3", "src": "令和6年秋 午前II 問3", "exam": "A-2", "cat": "管理・法規・標準", "q": "様々なサイバー攻撃手法を分類したナレッジベースはどれか。", "c": ["CVSS", "MITRE ATT&CK", "STIX/TAXII", "サイバーキルチェーン"], "a": 1, "e": "MITRE ATT&CKは、攻撃者の戦術・テクニックを体系化したナレッジベース。CVSSは脆弱性の評価、STIX/TAXIIは脅威情報の交換に使う。"}, {"id": "24aS4", "src": "令和6年秋 午前II 問4", "exam": "A-2", "cat": "攻撃手法・対策", "q": "NTPリフレクション攻撃の特徴はどれか。", "c": ["攻撃対象である NTP サーバに高頻度で時刻を問い合わせる。", "攻撃対象である NTP サーバの時刻情報を書き換える。", "送信元を偽って, NTP サーバに echo request を送信する。", "送信元を偽って, NTP サーバにレスポンスデータが大きくなるリクエストを送信する。"], "a": 3, "e": "NTPリフレクション攻撃は、送信元を偽装してmonlistなど応答が大きくなる要求をNTPサーバに送り、増幅した応答を攻撃対象に向ける。"}, {"id": "24aS5", "src": "令和6年秋 午前II 問5", "exam": "A-2", "cat": "暗号・認証", "q": "PQC (Post-Quantum Cryptography) はどれか。", "c": ["量子アニーリングマシンを用いて, 回路サイズ, 消費電力, 処理速度を飛躍的に向上させた実装性能をもつ暗号方式", "量子コンピュータを用いて効率的に素因数分解を行うアルゴリズムによって, 暗号を解読する技術", "量子コンピュータを用いても解読が困難であり, 安全性を保つことができる暗号方式", "量子通信路を用いた鍵配送システムを利用し, 大容量のデータを高速に送受信する技術"], "a": 2, "e": "PQC(耐量子計算機暗号)は、量子コンピュータでも解読が困難な暗号方式(格子暗号など)。"}, {"id": "24aS6", "src": "令和6年秋 午前II 問6", "exam": "A-2", "cat": "攻撃手法・対策", "q": "Smurf 攻撃はどれか。", "c": ["ICMP エコー要求パケットの送信元 IP アドレスに攻撃対象の IP アドレスを設定し, 宛先にブロードキャストアドレスを設定して送信することによって攻撃対象を利用不能にさせる。", "送信元 IP アドレスに偽の IP アドレスを設定し, かつ, 攻撃対象の受信可能範囲を超える大きなパケットを送信して攻撃対象を停止させる。", "送信元 IP アドレスに偽の IP アドレスを設定した大量の SYN パケットを送信し,攻撃対象からの SYN-ACK パケットに対して SYN-ACK の応答を送信しないことによって攻撃対象のリソースを枯渇させる。", "ボットネットを使って多数の端末から攻撃対象のメールサーバに大量のなりすましメールを送信し, 攻撃対象のメールサーバを停止させる。"], "a": 0, "e": "Smurfは送信元を攻撃対象に偽装したICMPエコー要求をブロードキャストアドレスに送る攻撃。ウはSYNフラッド。"}, {"id": "24aS8", "src": "令和6年秋 午前II 問8", "exam": "A-2", "cat": "暗号・認証", "q": "シングルサインオン (SSO) に関する記述のうち, 適切なものはどれか。", "c": ["SAML 方式では, URL 形式の 1 人一つの利用者 ID を IdP (Identity Provider) で自動生成することによって, インターネット上の複数の Web サイトにおける SSO を実現する。", "エージェント方式では, クライアント PC に導入したエージェントが SSO の対象システムのログイン画面を監視し, ログイン画面が表示されたら認証情報を代行入力する。", "代理認証方式では, SSO の対象サーバに SSO のモジュールを組み込む必要があり,システムの改修が必要となる。", "リバースプロキシ方式では, SSO を利用する全てのトラフィックがリバースプロキシサーバに集中する。"], "a": 3, "e": "リバースプロキシ方式では全通信がプロキシに集中する(単一障害点になり得る)。イは代理認証方式、ウはエージェント方式の説明。"}, {"id": "24aS9", "src": "令和6年秋 午前II 問9", "exam": "A-2", "cat": "暗号・認証", "q": "量子暗号の特徴として, 適切なものはどれか。", "c": ["暗号化と復号の処理を, 量子コンピュータを用いて行うことができるので, 従来のコンピュータでの処理に比べて大量のデータの秘匿を短時間で実現できる。", "共通鍵暗号方式であり, 従来の情報の取扱量の最小単位であるビットの代わりに量子ビットを用いることによって, 高速なデータ送受信が実現できる。", "量子雑音を用いて共通鍵を生成し, 公開鍵暗号方式で共有することによって, 解読が困難な秘匿通信が実現できる。", "量子通信路を用いて安全に共有した乱数列を使い捨ての暗号鍵として用いることによって, 原理的に第三者に解読されない秘匿通信が実現できる。"], "a": 3, "e": "量子暗号(量子鍵配送)は量子通信路で乱数を共有し、ワンタイムパッドとして使うことで原理的に盗聴を検知・防止できる。"}, {"id": "24aS10", "src": "令和6年秋 午前II 問10", "exam": "A-2", "cat": "Web・メール・DNS", "q": "電子メールの受信者側のメールサーバでの送信ドメイン認証が失敗したときの処理方針を, 送信側のドメイン管理者が指定するための仕組みはどれか。", "c": ["DKIM", "DMARC", "SMTP-AUTH", "SPF"], "a": 1, "e": "DMARCは、SPFやDKIMの認証が失敗したときの処理方針(none/quarantine/reject)を送信側がDNSで宣言する仕組み。"}, {"id": "24aS11", "src": "令和6年秋 午前II 問11", "exam": "A-2", "cat": "管理・法規・標準", "q": "SOAR (Security Orchestration, Automation and Response) の説明はどれか。", "c": ["脅威インテリジェンスの活用, セキュリティ運用の自動化及びインシデント対応の効率化を行う技術", "全ての利用者,。 デバイス, 接続元を信頼できないものとして捉え, 重要な情報資産やシステムに対するアクセスの正当性や安全性の検証を自動化することによって脅威を防ぐ考え方", "組織間でサイバー攻撃に関する情報を効率的に交換するために, 脅威情報構造化記述形式で記述された情報の交換を自動化するためのプロトコル仕様", "ファイアウォール, マルウェア対策製品, 侵入検知製品など複数のセキュリティ製品のログの集約及び相関分析を自動化するための専用"], "a": 0, "e": "SOARは脅威インテリジェンスの活用、運用の自動化、インシデント対応の効率化を行う。イはゼロトラスト、ウはTAXII、エはSIEM。"}, {"id": "24aS12", "src": "令和6年秋 午前II 問12", "exam": "A-2", "cat": "攻撃手法・対策", "q": "WAF におけるフォールスポジティブに該当するものはどれか。", "c": ["HTML の特殊文字 “<” を検出したときに通信を遮断するように WAF を設定した場合, 数式を入力する Web サイトに “<”を数式の一部として含んだ HTTP リクエストが送信されたとき, WAF が攻撃として検知し, 遮断する。", "HTTP リクエストのうち, RFC などに定義されておらず, Web アプリケーションソフトウェアの開発者が独自に追加したフィールドについては WAF が検査しないという仕様を悪用して, 攻撃の命令を埋め込んだ HTTP リクエストが送信されたとき,WAF が遮断しない。", "HTTP リクエストのパラメータ中に許可しない文字列を検出したときに通信を遮断するようにWAF を設定した場合, 許可しない文字列をパラメータ中に含んだ不正な HTTP リクエストが送信されたとき, WAF が攻撃として検知し, 遮断する。", "悪意のある通信を正常な通信と見せかけ, HTTP リクエストを分割して送信されたとき, WAF が遮断しない。"], "a": 0, "e": "フォールスポジティブ(過検知)は正常な通信を攻撃と誤判定すること。数式の「<」を遮断するのが該当。"}, {"id": "24aS13", "src": "令和6年秋 午前II 問13", "exam": "A-2", "cat": "攻撃手法・対策", "q": "インラインモードで動作するアノマリ型 IPS はどれか。", "c": ["IPS が監視対象の通信経路を流れる全ての通信パケットを経路外からキャプチャできるように通信経路上のスイッチのミラーポートに接続される。 異常な通信を定義し, それと合致する通信を不正と判断して遮断する。", "IPS が監視対象の通信経路を流れる全ての通信パケットを経路外からキャプチャできるように通信経路上のスイッチのミラーポートに接続される。 通常時の通信を定義し, それから外れた通信を不正と判断して遮断する。", "IPS が監視対象の通信を通過させるように通信経路上に設置される。 異常な通信を定義し, それと合致する通信を不正と判断して遮断する。", "IPS が監視対象の通信を通過させるように通信経路上に設置される。通常時の通信を定義し, それから外れた通信を不正と判断して遮断する。"], "a": 3, "e": "インラインは経路上に設置する方式、アノマリ型は「通常の通信」を定義して、そこから外れたものを不正と判断する。"}, {"id": "24aS14", "src": "令和6年秋 午前II 問14", "exam": "A-2", "cat": "Web・メール・DNS", "q": "クリックジャッキング攻撃に有効な対策はどれか。", "c": ["cookie に, HttpOnly 属性を設定する。", "cookie に, Secure 属性を設定する。", "HTTP レスポンスヘッダーに, Strict-Transport-Security を設定する。", "HTTP レスポンスヘッダーに, X-Frame-Options を設定する。"], "a": 3, "e": "クリックジャッキングは透明なiframeで重ねて操作させる攻撃。X-Frame-Options(またはCSPのframe-ancestors)でフレーム表示を禁止する。"}, {"id": "24aS15", "src": "令和6年秋 午前II 問15", "exam": "A-2", "cat": "ネットワーク", "q": "DTLS の特徴はどれか。", "c": ["IPパケットの暗号化を可能としている。", "PPP で接続する際のチャレンジレスポンス認証機能をイーサネット上の通信に提供している。", "TCP のペイロードデータの暗号強度をTLS よりも強化している。", "UDP のペイロードデータの暗号化を可能としている。"], "a": 3, "e": "DTLSはUDP上で動くTLS相当のプロトコル。UDPのペイロードを暗号化できる。"}, {"id": "24aS16", "src": "令和6年秋 午前II 問16", "exam": "A-2", "cat": "暗号・認証", "q": "利用者A が所有するリソース B が, Web サービス C 上にある。OAuth 2.0 において,利用者 A の認可の下, Web サービス D からリソース B への限定されたアクセスを可能にするときのプロトコルの動作はどれか。ここで Web サービス(C は, 認可サーバを兼ねているものとする。", "c": ["Web サービスC が, アクセストークンを発行する。", "Web サービス C が, 利用者Aのデジタル証明書を Web サービス D に送信する。", "Web サービス D が, アクセストークンを発行する。", "Web サービス D が, 利用者A のデジタル証明書を Web サービス C に送信する。"], "a": 0, "e": "OAuth2.0では認可サーバ(ここではC)が、Aの許可を得てアクセストークンを発行し、Dはそれを使ってBにアクセスする。"}, {"id": "24aS17", "src": "令和6年秋 午前II 問17", "exam": "A-2", "cat": "ネットワーク", "q": "利用者認証情報を管理するサーバ 1 台と複数のアクセスポイントで構成された無線LAN 環境を実現したい。PC が無線 LAN 環境に接続するときの利用者認証とアクセス制御に, IEEE 802.1X と RADIUS を利用する場合の標準的な方法はどれか。", "c": ["PC には IEEE 802.1X のサプリカントを実装し, かつ, RADIUS クライアントの機能をもたせる。", "アクセスポイントには IEEE 802.1X のオーセンティケータを実装し, かつ,RADIUS クライアントの機能をもたせる。", "アクセスポイントには IEEE 802.1X のサプリカントを実装し, かつ, RADIUS サーバの機能をもたせる。", "サーバには IEEE 802.1X のオーセンティケータを実装し, かつ, RADIUS サーバの機能をもたせる。"], "a": 1, "e": "802.1Xでは、PC=サプリカント、AP=オーセンティケータ(RADIUSクライアントを兼ねる)、認証サーバ=RADIUSサーバ。"}, {"id": "24aS18", "src": "令和6年秋 午前II 問18", "exam": "A-2", "cat": "ネットワーク", "q": "ネットワーク層のパケットを対象として IP パケットでカプセル化し, トンネリングを行えるプロトコルはどれか。", "c": ["IPsec", "L2TP", "PPTP", "RSTP"], "a": 0, "e": "IPsec(トンネルモード)はIPパケットをIPでカプセル化する。L2TPやPPTPはデータリンク層(PPP)のトンネリング。"}, {"id": "24aS19", "src": "令和6年秋 午前II 問19", "exam": "A-2", "cat": "ネットワーク", "q": "IPv4 における ICMP のメッセージに関する説明として, 適切なものはどれか。", "c": ["送信元が設定したソースルーティングが失敗した場合は, Echo Reply を返す。", "転送されてきたデータグラムを受信したルータが, そのネットワークの最適なルータを送信元に通知して経路の変更を要請するには, Redirect を返す。", "フラグメントの再組立て中にタイムアウトが発生した場合は, データグラムを破棄して Parameter Problem を返す。", "ルータでメッセージを転送する際に, 送信元が設定した TTL が 0 になった場合は,Destination Unreachable を返す。"], "a": 1, "e": "ICMP Redirectは、より適切なルータを送信元に知らせて経路変更を促す。TTLが切れたときに返すのはTime Exceeded。"}, {"id": "24aS20", "src": "令和6年秋 午前II 問20", "exam": "A-2", "cat": "ネットワーク", "q": "ネットワーク機器間の光ファイバを使った通信を分岐させてネットワーク上のトラフィックを取り出し, セキュリティ装置で監視したい。ネットワークから信号を光学的に分岐させて取り出す装置はどれか。", "c": ["ネットワークタップ", "波長分割多重装置", "ルータ", "レイヤ"], "a": 0, "e": "光信号を分岐させて通信をそのまま取り出す装置はネットワークタップ。"}, {"id": "24aS21", "src": "令和6年秋 午前II 問21", "exam": "A-2", "cat": "開発・DB・運用", "q": "関係モデルにおける外部キーに関する記述のうち, 適切なものはどれか。", "c": ["外部キーの値は, その関係の中で一意でなければならない。", "外部キーは, それが参照する候補キーと比較可能でなくてもよい。", "参照先の関係に, 参照元の外部キーの値と一致する候補キーが存在しなくてもよい。", "一つの関係に外部キーが複数存在してもよい。"], "a": 3, "e": "1つの関係(表)に外部キーは複数あってよい。外部キーは一意である必要はなく、参照先に対応する値が存在しなければならない。"}, {"id": "24aS22", "src": "令和6年秋 午前II 問22", "exam": "A-2", "cat": "開発・DB・運用", "q": "ソフトウェアパターンのうち, GoF のデザインパターンの説明はどれか。", "c": ["Java のパターンとして, 引数オブジェクト, オブジェクトの可変性などで構成される。", "オブジェクト指向開発のためのパターンであって, 生成, 構造, 振る舞いの三つのカテゴリに分類される。", "構造, 分散システム, 対話型システム及び適合型システムの四つのカテゴリに分類される。", "抽象度が異なる要素を分割して階層化するための Layers,、 コンポーネント分割のための Broker などで構成される。"], "a": 1, "e": "GoFのデザインパターンは23種類あり、生成・構造・振る舞いの3つに分類される。"}, {"id": "24aS23", "src": "令和6年秋 午前II 問23", "exam": "A-2", "cat": "開発・DB・運用", "q": "エクストリームプログラミング (XP : Extreme Programming) における“テスト駆動開発\" の特徴はどれか。", "c": ["最初のテストで, なるべく多くのバグを摘出する。", "テストケースの改善を繰り返す。", "テストでのカバレージを高めることを目的とする。", "プログラムコードを書く前にテストコードを書く。"], "a": 3, "e": "テスト駆動開発(TDD)は、実装のコードより先にテストコードを書く。"}, {"id": "24aS24", "src": "令和6年秋 午前II 問24", "exam": "A-2", "cat": "開発・DB・運用", "q": "JIS Q 20000-1:2020 (サービスマネジメントシステム要求事項) によれば, サービスマネジメントシステム (SMS) における継続的改善の定義はどれか。", "c": ["意図した結果を得るためにインプットを使用する, 相互に関連する又は相互に作用する一連の活動", "価値を提供するため, サービスの計画立案, 設計, 移行, 提供及び改善のための組織の活動及び資源を, 指揮し, 管理する, 一連の能力及びプロセス", "サービスを中断なしに, 又は合意した可用性を一貫して提供する能力", "パフォーマンスを向上するために繰り返し行われる活動"], "a": 3, "e": "JIS Q 20000-1での継続的改善は「パフォーマンスを向上するために繰り返し行われる活動」。アはプロセス、ウは可用性の定義。"}, {"id": "24aS25", "src": "令和6年秋 午前II 問25", "exam": "A-2", "cat": "開発・DB・運用", "q": "アクセス管理に関する内部統制のうち, 金融庁 “財務報告に係る内部統制の評価及び監査に関する実施基準 (令和 5 年)” における IT に係る業務処理統制に該当するものはどれか。", "c": ["組織としてアクセス管理規程を定め, 統一的なアクセス管理を行う。", "組織としてアクセス権限の設定方針を定め, 周知徹底を図る。", "組織内のアプリケーションシステムに, 利用者 ID とパスワードによって利用者を認証する機能を設ける。", "組織内の全ての利用者に対して, アクセス管理の重要性についての教育を行う。"], "a": 2, "e": "業務処理統制はアプリケーションに組み込まれた統制(認証機能など)。ア・イ・エは全般統制や全社的統制。"}, {"id": "24hS1", "src": "令和6年春 午前II 問1", "exam": "A-2", "cat": "Web・メール・DNS", "q": "クロスサイトリクエストフォージェリ攻撃の対策として, 効果がないものはどれか。", "c": ["Web サイトでの決済などの重要な操作の都度, 利用者のパスワードを入力させる。", "Web サイトへのログイン後, 毎回異なる値を HTTP レスポンスボディに含め,Web ブラウザからのリクエストごとに送付されるその値を, Web サーバ側で照合する。", "Web ブラウザからのリクエスト中のReferer によって正しいリンク元からの遷移であることを確認する。", "Web ブラウザからのリクエストを Web サーバで受け付けた際に, リクエストに含まれる “<”, “>” などの特殊文字を, “&lt;”, “&gt;” などの文字列に置き換える。"], "a": 3, "e": "特殊文字のエスケープはXSSへの対策で、CSRFには効果がない。CSRFの対策は再認証、トークン、Refererの確認。"}, {"id": "24hS2", "src": "令和6年春 午前II 問2", "exam": "A-2", "cat": "暗号・認証", "q": "送信者から受信者にメッセージ認証符号 (MAC : Message Authentication Code) を付与したメッセージを送り, 次に受信者が第三者に転送した。そのときのMAC に関する記述のうち, 適切なものはどれか。ここで, 共通鍵は送信者と受信者だけが知っており, 送信者と受信者のそれぞれの公開鍵は第三者を含めた 3 名が知っているものとする。", "c": ["MAC は, 送信者がメッセージと共通鍵を用いて生成する。MAC を用いると, 受信者がメッセージの完全性を確認できる。", "MAC は, 送信者がメッセージと共通鍵を用いて生成する。MAC を用いると, 第三者が送信者の真正性を確認できる。", "MAC は, 送信者がメッセージと受信者の公開鍵を用いて生成する。MAC を用いると, 第三者がメッセージの完全性を確認できる。", "MAC は, 送信者がメッセージと送信者の公開鍵を用いて生成する。MAC を用いると, 受信者が送信者の真正性を確認できる。"], "a": 0, "e": "MACは共通鍵で生成するため、鍵を共有する受信者だけが完全性を検証できる。第三者は鍵を知らず、否認防止もできない。"}, {"id": "24hS3", "src": "令和6年春 午前II 問3", "exam": "A-2", "cat": "暗号・認証", "q": "PKI (公開鍵基盤) を構成するRA (Registration Authority) の役割はどれか。", "c": ["デジタル証明書にデジタル署名を付与する。", "デジタル証明書に紐づけられた属性証明書を発行する。", "デジタル証明書の失効リストを管理し, デジタル証明書の有効性を確認する。", "本人確認を行い, デジタル証明書の発行申請の承認又は却下を行う。"], "a": 3, "e": "RA(登録局)は本人確認を行い、証明書の発行申請を承認・却下する。署名を付与するのはCA。"}, {"id": "24hS4", "src": "令和6年春 午前II 問4", "exam": "A-2", "cat": "暗号・認証", "q": "標準化団体 OASIS が, Web サイトなどを運営するオンラインビジネスパートナー間で認証, 属性及び認可の情報を安全に交換するために策定したものはどれか。", "c": ["SAML", "SOAP", "XKMS", "XML Signature"], "a": 0, "e": "SAMLはOASISが策定した、認証・属性・認可の情報を交換するための仕様。"}, {"id": "24hS5", "src": "令和6年春 午前II 問5", "exam": "A-2", "cat": "攻撃手法・対策", "q": "送信元IP アドレスがA, 送信元ポート番号が 80/tcp, 宛先IP アドレスがホストに割り振られていない未使用の IP アドレスである SYN/ACK パケットを大量に観測した場合, 推定できる攻撃はどれか。", "c": ["IP アドレスAを攻撃先とするサービス妨害攻撃", "IP アドレスAを攻撃先とするパスワードリスト攻撃", "IP アドレスAを攻撃元とするサービス妨害攻撃", "IP アドレスAを攻撃元とするパスワードリスト攻撃"], "a": 0, "e": "送信元を偽装したSYNを受けたAが、未使用のアドレス宛てにSYN/ACKを返している状態。Aが攻撃先のSYNフラッド(バックスキャッタ)。"}, {"id": "24hS6", "src": "令和6年春 午前II 問6", "exam": "A-2", "cat": "暗号・認証", "q": "X.509 におけるCRL に関する記述のうち, 適切なものはどれか。", "c": ["RFC 5280 では, 認証局は, 発行したデジタル証明書のうち失効したものについては, シリアル番号を失効後 1 年間 CRL に記載するよう義務付けている。", "Web サイトの利用者の Web ブラウザは, その Web サイトにサーバ証明書を発行した認証局の公開鍵が Web ブラウザに組み込まれていれば, CRL を参照しなくてもよい。", "認証局は, 発行した全てのデジタル証明書の有効期限を CRL に記載する。", "認証局は, 有効期限内のデジタル証明書が失効されたとき, そのシリアル番号をCRL に記載する。"], "a": 3, "e": "CRLには、有効期限内に失効した証明書のシリアル番号を記載する。期限切れになったものは載せなくてよい。"}, {"id": "24hS7", "src": "令和6年春 午前II 問7", "exam": "A-2", "cat": "管理・法規・標準", "q": "ISMAP-LIU クラウドサービス登録規則 (令和6 年3 月 1 日最終改定) での ISMAP-LIU に関する記述として, 適切なものはどれか。", "c": ["JIS Q 27001 に加え, JIS Q 27017 に規定されたクラウドサービス固有の管理策が適切に導入, 実施されていることも認証する。", "アウトソーシング事業者が記述したセキュリティの内部統制に対しても, 監査法人が評価手続を実施した結果とその意見を表明する。", "リスクの小さな業務・情報の処理に用いる SaaS サービスを対象とする。", "我が国の政府機関などにおける情報セキュリティのベースライン, 及びより高い水準の情報セキュリティを確保するための対策事項を規定している。"], "a": 2, "e": "ISMAP-LIUは、リスクの小さな業務や情報の処理に使うSaaSを対象にした制度。"}, {"id": "24hS8", "src": "令和6年春 午前II 問8", "exam": "A-2", "cat": "管理・法規・標準", "q": "組織のセキュリティインシデント管理の成熟度を評価するために Open CSIRT Foundation が開発したモデルはどれか。", "c": ["CMMC", "CMMI", "SAMM", "SIM3"], "a": 3, "e": "SIM3は、Open CSIRT Foundationが開発したCSIRTの成熟度モデル。"}, {"id": "24hS9", "src": "令和6年春 午前II 問9", "exam": "A-2", "cat": "管理・法規・標準", "q": "JVNなどの脆弱性対策ポータルサイトで採用されている CWE はどれか。", "c": ["IT 製品の脆弱性を評価する手法", "製品を識別するためのプラットフォーム名の一覧", "セキュリティに関連する設定項目を識別するための識別子", "ソフトウェア及びハードウェアの脆弱性の種類の一覧"], "a": 3, "e": "CWEは脆弱性の種類(弱点)の一覧。CVEは個別の脆弱性、CPEは製品名、CVSSは評価手法、CCEは設定項目。"}, {"id": "24hS10", "src": "令和6年春 午前II 問10", "exam": "A-2", "cat": "暗号・認証", "q": "FIPS PUB 140-3 はどれか。", "c": ["暗号モジュールのセキュリティ要求事項", "情報セキュリティマネジメントシステムの要求事項", "デジタル証明書や証明書失効リストの技術仕様", "無線LAN セキュリティの技術仕様"], "a": 0, "e": "FIPS 140-3は米国の暗号モジュールのセキュリティ要求事項。"}, {"id": "24hS11", "src": "令和6年春 午前II 問11", "exam": "A-2", "cat": "管理・法規・標準", "q": "セキュリティ対策として, CASB を利用した際の効果はどれか。", "c": ["クラウドサービスカスタマの管理者が, 従業員が利用しているクラウドサービスに対して, CASB を利用して脆弱性診断を行うことによって, 脆弱性を特定できる。", "クラウドサービスカスタマの管理者が, 従業員が利用しているクラウドサービスに対して, CASB を利用して利用状況の可視化を行うことによって, 許可を得ずにクラウドサービスを利用している者を特定できる。", "クラウドサービスプロバイダが, 運用しているクラウドサービスに対して, CASBを利用して DDoS 攻撃対策を行うことによって, クラウドサービスの可用性低下を緩和できる。", "クラウドサービスプロバイダが, クラウドサービスを運用している施設に対して,CASB を利用して入退室管理を行うことによって, クラウドサービス運用環境への物理的な不正アクセスを防止できる。"], "a": 1, "e": "CASBは従業員のクラウド利用を可視化・制御し、シャドーITを発見できる。"}, {"id": "24hS12", "src": "令和6年春 午前II 問12", "exam": "A-2", "cat": "ネットワーク", "q": "不特定多数の利用者に無料で開放されている公衆無線LAN サービスのアクセスポイントと端末で利用される仕様として, Wi-Fi Alliance の Enhanced Open によって新規に規定されたものはどれか。", "c": ["端末でのパスワードの入力で, 端末からアクセスポイントへの接続が可能となる仕様", "端末でのパスワードの入力で, 端末とアクセスポイントとの通信の暗号化が可能となる仕様", "端末でのパスワードの入力なしに, 端末からアクセスポイントへの接続が可能となる仕様", "端末でのパスワードの入力なしに, 端末とアクセスポイントとの通信の暗号化が可能となる仕様"], "a": 3, "e": "Enhanced Open(OWE)は、パスワードを入力しなくても端末とAPの間の通信を暗号化できる仕様。"}, {"id": "24hS14", "src": "令和6年春 午前II 問14", "exam": "A-2", "cat": "ネットワーク", "q": "IEEE 802.1X におけるサプリカントはどれか。", "c": ["一度の認証で複数のサーバやアプリケーションを利用できる認証システム", "クライアント側から送信された認証情報を受け取り, 認証を行うシステム", "クライアント側と認証サーバの仲介役となり, クライアント側から送信された認証情報を受け取り, 認証サーバに送信するネットワーク機器", "認証を要求するクライアント側の装置やソフトウェア"], "a": 3, "e": "802.1Xのサプリカントは、認証を要求するクライアント側の装置やソフトウェア。ウはオーセンティケータ、イは認証サーバ。"}, {"id": "24hS15", "src": "令和6年春 午前II 問15", "exam": "A-2", "cat": "Web・メール・DNS", "q": "DNS においてDNS CAA (Certification Authority Authorization) レコードを設定することによるセキュリティ上の効果はどれか。", "c": ["Web サイトにアクセスしたときの Web ブラウザに鍵マークが表示されていれば当該サイトが安全であることを, 利用者が確認できる。", "Web サイトにアクセスする際の URL を短縮することによって, 利用者の URL の誤入力を防ぐ。", "電子メールを受信するサーバでスパムメールと誤検知されないようにする。", "不正なサーバ証明書の発行を防ぐ。"], "a": 3, "e": "CAAレコードは、そのドメインの証明書を発行してよい認証局を指定し、不正な証明書の発行を防ぐ。"}, {"id": "24hS17", "src": "令和6年春 午前II 問17", "exam": "A-2", "cat": "開発・DB・運用", "q": "ソフトウェアの脆弱性管理のためのツールとしても利用される SBOM (Software Bill of Materials) はどれか。", "c": ["ソフトウェアの脆弱性に対する, ベンダーに依存しないオープンで汎用的な深刻度の評価方法", "ソフトウェアのセキュリティアップデートを行うときに推奨される管理プロセス,組織体制などをまとめたガイドライン", "ソフトウェアを構成するコンポーネント, 互いの依存関係などのリスト", "米国の非営利団体 MITRE によって策定された, ソフトウェアにおけるセキュリティ上の弱点の種類を識別するための基準"], "a": 2, "e": "SBOMは、ソフトウェアを構成するコンポーネントや依存関係などの一覧。アはCVSS、エはCWE。"}, {"id": "24hS18", "src": "令和6年春 午前II 問18", "exam": "A-2", "cat": "ネットワーク", "q": "TCP ヘッダーに含まれる情報はどれか。", "c": ["宛先ポート番号", "送信元 IP アドレス", "パケット生存時間 (TTL)", "プロトコル番号"], "a": 0, "e": "TCPヘッダーにはポート番号などが入る。IPアドレス、TTL、プロトコル番号はIPヘッダーの項目。"}, {"id": "24hS19", "src": "令和6年春 午前II 問19", "exam": "A-2", "cat": "Web・メール・DNS", "q": "TCP のサブミッションポート (ポート番号 587) の説明として, 適切なものはどれか。", "c": ["FTP サービスで, 制御用コネクションのポート番号 21 とは別にデータ転送用に使用する。", "Web サービスで, ポート番号 80 の HTTP 要求とは別に, サブミットボタンをクリックした際の入力フォームのデータ送信に使用する。", "コマンド操作の遠隔ログインで, 通信内容を暗号化するために TELNET のポート番号 23 の代わりに使用する。", "電子メールサービスで, 迷惑メール対策などのために SMTP のポート番号 25 の代わりに使用する。"], "a": 3, "e": "サブミッションポート587は、メールクライアントからの送信用ポート。SMTP-AUTHと組み合わせ、OP25Bを回避する。"}, {"id": "24hS20", "src": "令和6年春 午前II 問20", "exam": "A-2", "cat": "Web・メール・DNS", "q": "Web サーバから送信される HTTP ヘッダーのうち, Web サーバからの応答の内容を,Web ブラウザやプロキシサーバなどのキャッシュに保持させないようにするものはどれか。", "c": ["Cache-Control: no-cache", "Cache-Control: no-store", "Cache-Control: private", "Cache-Control: public"], "a": 1, "e": "no-storeはキャッシュへの保存自体を禁止する。no-cacheは保存してよいが、使う前にサーバへの再検証が必要。"}, {"id": "24hS22", "src": "令和6年春 午前II 問22", "exam": "A-2", "cat": "開発・DB・運用", "q": "仕様書やソースコードについて, 作成者を含めた複数人で, 記述されたシステムやソフトウェアの振る舞いを机上でシミュレートして, 問題点を発見する手法はどれか。", "c": ["ウォークスルー", "サンドイッチテスト", "トップダウンテスト", "並行シミ"], "a": 0, "e": "作成者を含む複数人で、仕様書やコードの動きを机上でシミュレーションするレビュー手法はウォークスルー。"}, {"id": "24hS23", "src": "令和6年春 午前II 問23", "exam": "A-2", "cat": "開発・DB・運用", "q": "ソフトウェアの品質を確保するための検証に形式手法を用いる。このとき行う検証方法の説明として, 適切なものはどれか。", "c": ["進行役 (モデレーター), 記録役などの役割を決めた複数人で, 成果物に欠陥がないかどうかを検証する。", "プログラムの内部構造とは無関係し. プログラムが仕様どおりに機能するかどうかを検証する。", "プログラムの内部構造に着目し, プログラムが仕様どおりに動作するかどうかを検証する。", "明確で厳密な意味を定義することができる言語を用いてソフトウェアの仕様を記述して, 満たすべき性質と仕様とが整合しているかどうかを論理的に検証する。"], "a": 3, "e": "形式手法は厳密に意味を定義できる言語で仕様を記述し、性質との整合性を論理的に検証する。イはブラックボックステスト、ウはホワイトボックステスト。"}, {"id": "24hS25", "src": "令和6年春 午前II 問25", "exam": "A-2", "cat": "開発・DB・運用", "q": "金融庁 “財務報告に係る内部統制の評価及び監査に関する実施基準 (令和 5 年)\"における, IT に係る全般統制に該当するものとして, 最も適切なものはどれか。", "c": ["アプリケーションプログラムの例外処理 (エラー) の修正と再処理", "業務別マスタ・データの維持管理", "システムの開発, 保守に係る管理", "入力情報の完全性, 正確性, 正当性等を確保する統"], "a": 2, "e": "全般統制はシステムの開発・保守・運用管理など、業務処理統制を支える基盤の統制。ア・イ・エは業務処理統制。"}];const K='scq1';let S=JSON.parse(localStorage.getItem(K)||'{}');S.h=S.h||{};S.w=S.w||{};S.d=S.d||{};
const save=()=>localStorage.setItem(K,JSON.stringify(S));const L='アイウエ';
const ex=new Date('2026-10-27T09:30:00+09:00');const n0=new Date();const dd=Math.round((new Date(2026,9,27)-new Date(n0.getFullYear(),n0.getMonth(),n0.getDate()))/864e5);document.getElementById('cd').textContent=dd>0?`科目Aまで あと${dd}日`:'試験日';
const cats=[...new Set(Q.map(q=>q.cat))];const $=id=>document.getElementById(id);
$('cat').innerHTML='<option value="">全カテゴリ</option><option value="A-1">科目A-1(共通)のみ</option><option value="A-2">科目A-2(セキュリティ)のみ</option>'+cats.map(c=>`<option>${c}</option>`).join('');
$('mode').value=S.mode||'smart';$('cat').value=S.cat||'';
$('mode').onchange=$('cat').onchange=()=>{S.mode=$('mode').value;S.cat=$('cat').value;save();next()};
function pool(){const c=$('cat').value,m=$('mode').value;let p=Q.filter(q=>!c||q.cat==c||q.exam==c);
 if(m=='new')p=p.filter(q=>!S.h[q.id]);if(m=='review')p=p.filter(q=>S.w[q.id]);return p}
let cur,last=[];
function next(){const p=pool();const m=$('mode').value;$('pool').textContent=`対象 ${p.length}問`;
 if(!p.length){$('qc').innerHTML=m=='review'?'<p>復習キューは空です 🎉</p>':'<p>この条件の問題はすべて回答済みです。モードを変えてください。</p>';return}
 let c=p.filter(q=>!last.includes(q.id));if(!c.length)c=p;
 if(m=='smart'){const w=c.map(q=>S.w[q.id]?4:(S.h[q.id]?1:3));let r=Math.random()*w.reduce((a,b)=>a+b),i=0;while((r-=w[i])>0)i++;cur=c[i]}else cur=c[Math.floor(Math.random()*c.length)];
 last=[cur.id,...last].slice(0,20);render()}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){const q=cur,h=S.h[q.id];
 $('qc').innerHTML=`<div class="src"><span class="tag">${q.exam}</span><span class="tag">${q.cat}</span>${q.src}${h?` ・正答 ${h.c}/${h.n}`:''}</div><div>${esc(q.q)}</div>`+
 q.c.map((c,i)=>`<button class="ch" data-i="${i}"><b>${L[i]}</b>${esc(c)}</button>`).join('')+'<div id="af"></div>';
 document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>ans(+b.dataset.i));window.scrollTo(0,0)}
function ans(i){const q=cur;if(document.querySelector('.ok'))return;const ok=i==q.a;
 document.querySelectorAll('.ch').forEach((b,j)=>{if(j==q.a)b.classList.add('ok');else if(j==i)b.classList.add('ng')});
 const h=S.h[q.id]||{n:0,c:0};h.n++;if(ok)h.c++;S.h[q.id]=h;
 if(ok){if(S.w[q.id]){S.w[q.id]--;if(S.w[q.id]<=0)delete S.w[q.id]}}else S.w[q.id]=2;
 const t=new Date().toISOString().slice(0,10);S.d[t]=S.d[t]||{n:0,c:0};S.d[t].n++;if(ok)S.d[t].c++;save();
 $('af').innerHTML=`<div class="ex"><b>${ok?'⭕ 正解':'❌ 不正解'}　正解は ${L[q.a]}</b><br>${esc(q.e)}${!ok?'<br><small>→ 復習キューに追加（2回連続正解で卒業）</small>':''}</div><button class="btn" onclick="next()">次の問題 ▶</button>`;
 $('af').scrollIntoView({behavior:'smooth',block:'nearest'})}
function stats(){const ids=Object.keys(S.h);let n=0,c=0;ids.forEach(i=>{n+=S.h[i].n;c+=S.h[i].c});const t=new Date().toISOString().slice(0,10),td=S.d[t]||{n:0,c:0};
 $('st').innerHTML=`<div><b>${ids.length}/${Q.length}</b>挑戦済み</div><div><b>${n?Math.round(c/n*100):0}%</b>正答率</div><div><b>${Object.keys(S.w).length}</b>復習待ち</div><div><b>${td.n}</b>今日の回答</div><div><b>${td.n?Math.round(td.c/td.n*100):0}%</b>今日の正答率</div><div><b>${Object.keys(S.d).length}</b>学習日数</div>`;
 $('ct').innerHTML='<tr><td><b>カテゴリ</b></td><td>問題数</td><td>挑戦</td><td>正答率</td></tr>'+cats.map(ct=>{const qs=Q.filter(q=>q.cat==ct);let a=0,n=0,c=0;qs.forEach(q=>{const h=S.h[q.id];if(h){a++;n+=h.n;c+=h.c}});return `<tr><td>${ct}</td><td>${qs.length}</td><td>${a}</td><td>${n?Math.round(c/n*100)+'%':'-'}</td></tr>`}).join('')}
function tab(t){['Q','S'].forEach(x=>{$('v'+x).classList.toggle('hide',x!=t);$('t'+x).classList.toggle('on',x==t)});if(t=='S')stats()}
next();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
